<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
<title id="title">Rattrapage postopératoire : surveiller activement pour traiter tôt</title>
<desc id="desc">Frise du PSA après prostatectomie montrant surveillance structurée, remontée confirmée à bas PSA et radiothérapie de rattrapage précoce, avec une branche d’observation favorable explicitement planifiée.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24313A"/></marker></defs>
<rect width="1376" height="768" fill="#FFF8E8"/>
<rect width="18" height="768" fill="#007C83"/>
<text x="58" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="1.8">ONCORT ACADEMY · PROSTATE</text>
<rect x="58" y="51" width="340" height="32" rx="16" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="76" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.7">FRISE DÉCISIONNELLE PSA</text>
<text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">Rattrapage postopératoire : surveiller activement pour traiter tôt</text>
<rect x="58" y="152" width="1236" height="116" rx="18" fill="#FFFFFF" stroke="#007C83" stroke-width="3"/>
<text x="84" y="184" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#007C83" text-anchor="start" letter-spacing="0">APRÈS PROSTATECTOMIE · pN0 · PSA INDÉTECTABLE</text>
<text x="84" y="224" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Surveillance structurée plutôt qu’irradiation adjuvante systématique pour la majorité</text>
<line x1="130" y1="350" x2="1230" y2="350" stroke="#24313A" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="82" y="310" width="250" height="82" rx="15" fill="#E5EEF8" stroke="#2563A6" stroke-width="2"/>
<text x="207" y="341" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#2563A6" text-anchor="middle" letter-spacing="0">PSA INDÉTECTABLE</text>
<text x="207" y="372" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="middle" letter-spacing="0">calendrier défini</text>
<rect x="442" y="300" width="330" height="102" rx="15" fill="#FCE8C8" stroke="#D97706" stroke-width="2"/>
<text x="607" y="334" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#D97706" text-anchor="middle" letter-spacing="0">REMONTÉE CONFIRMÉE</text>
<text x="607" y="365" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="middle" letter-spacing="0">déclencheurs d’essais ~0,1–0,2</text>
<text x="607" y="388" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#C85C4A" text-anchor="middle" letter-spacing="0">≠ ordre automatique isolé</text>
<rect x="902" y="300" width="330" height="102" rx="15" fill="#DDF3F1" stroke="#007C83" stroke-width="2"/>
<text x="1067" y="334" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#007C83" text-anchor="middle" letter-spacing="0">SALVAGE PRÉCOCE</text>
<text x="1067" y="365" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="middle" letter-spacing="0">potentiellement curatif</text>
<text x="1067" y="388" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#007C83" text-anchor="middle" letter-spacing="0">avant PSA élevé</text>
<path d="M607 402 L607 466" stroke="#24313A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="360" y="466" width="494" height="154" rx="17" fill="#FFFFFF" stroke="#2563A6" stroke-width="3"/>
<text x="386" y="501" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#2563A6" text-anchor="start" letter-spacing="0">OBSERVATION DISCUTABLE SI PROFIL FAVORABLE</text>
<text x="386" y="536" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="386" dy="0">Intervalle long · ISUP bas · PSADT long</tspan><tspan x="386" dy="26">Espérance de vie et préférence intégrées</tspan><tspan x="386" dy="26">Calendrier + seuils + plan si accélération</tspan></text>
<rect x="886" y="466" width="408" height="154" rx="17" fill="#F8DDD7" stroke="#C85C4A" stroke-width="2"/>
<text x="910" y="500" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#C85C4A" text-anchor="start"><tspan x="910" dy="0">PIÈGE</tspan><tspan x="910" dy="27">Attendre un PSA élevé</tspan><tspan x="910" dy="27">parce que l’imagerie est négative</tspan><tspan x="910" dy="27">ou que le patient va bien</tspan></text>
<rect x="58" y="642" width="1236" height="34" rx="10" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="676" y="665" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Précoce = décision sur tendance + patient + pathologie, pas seuil isolé.</text>
<rect x="58" y="700" width="1260" height="42" rx="12" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="78" y="727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCES · RecoRad 2025 · EAU 2026 · CCAFU 2024–2026</text>
<text x="1298" y="727" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BBD8D2" text-anchor="end" letter-spacing="0">SYNTHÈSE ÉDUCATIVE · DONNÉES AGRÉGÉES</text>
</svg>
