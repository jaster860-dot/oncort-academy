<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
<title id="title">ADT avec salvage : sélectionner le risque et dater l’exposition</title>
<desc id="desc">Matrice de sélection de l’ADT avec radiothérapie de rattrapage, distinguant récidive favorable, profils défavorables et situations sélectionnées à risque très élevé.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24313A"/></marker></defs>
<rect width="1376" height="768" fill="#FFF8E8"/>
<rect width="18" height="768" fill="#007C83"/>
<text x="58" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="1.8">ONCORT ACADEMY · PROSTATE</text>
<rect x="58" y="51" width="340" height="32" rx="16" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="76" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.7">STRATIFICATION BÉNÉFICE–TOXICITÉ</text>
<text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">ADT avec salvage : sélectionner le risque et dater l’exposition</text>
<rect x="58" y="152" width="1236" height="86" rx="17" fill="#DDF3F1" stroke="#007C83" stroke-width="3"/>
<text x="82" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#007C83" text-anchor="start" letter-spacing="0.7">VARIABLES AVANT INTENSIFICATION</text>
<text x="82" y="215" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">PSA pré-RT · PSADT · ISUP · pT/pN · marges · persistance · imagerie · vulnérabilités</text>
<rect x="58" y="268" width="382" height="286" rx="18" fill="#FFFFFF" stroke="#2563A6" stroke-width="3"/>
<text x="82" y="303" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#2563A6" text-anchor="start" letter-spacing="0">RÉCIDIVE FAVORABLE</text>
<text x="84" y="345" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">• Très bas PSA</text>
<text x="84" y="380" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">• Cinétique lente</text>
<text x="84" y="415" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">• Rapport bénéfice–toxicité</text>
<text x="84" y="450" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">• potentiellement faible</text>
<rect x="82" y="482" width="334" height="44" rx="12" fill="#E5EEF8" stroke="#E5EEF8" stroke-width="0"/>
<text x="249" y="510" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#2563A6" text-anchor="middle" letter-spacing="0">Pas d’ADT automatique</text>
<rect x="470" y="268" width="382" height="286" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/>
<text x="494" y="303" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#D97706" text-anchor="start" letter-spacing="0">PROFIL DÉFAVORABLE</text>
<text x="496" y="345" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">• RecoRad : repères dont</text>
<text x="496" y="380" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">• PSA &gt; 0,5 ng/mL</text>
<text x="496" y="415" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">• ou PSADT &lt; 6 mois</text>
<rect x="494" y="482" width="334" height="44" rx="12" fill="#FCE8C8" stroke="#FCE8C8" stroke-width="0"/>
<text x="661" y="510" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#D97706" text-anchor="middle" letter-spacing="0">ADT courte ~6 mois</text>
<rect x="882" y="268" width="382" height="286" rx="18" fill="#FFFFFF" stroke="#C85C4A" stroke-width="3"/>
<text x="906" y="303" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#C85C4A" text-anchor="start" letter-spacing="0">SÉLECTION TRÈS À RISQUE</text>
<text x="908" y="345" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">• RecoRad : situations dont</text>
<text x="908" y="380" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">• pN1</text>
<text x="908" y="415" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">• ou PSA &gt; 1 ng/mL</text>
<rect x="906" y="482" width="334" height="44" rx="12" fill="#F8DDD7" stroke="#F8DDD7" stroke-width="0"/>
<text x="1073" y="510" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#C85C4A" text-anchor="middle" letter-spacing="0">Discuter jusqu’à 24 mois</text>
<rect x="58" y="580" width="1236" height="96" rx="15" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="82" y="611" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#BBD8D2" text-anchor="start" letter-spacing="0.7">LIMITES</text>
<text x="82" y="640" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#FFFFFF" text-anchor="start"><tspan x="82" dy="0">Les repères 6 et 24 mois ne sont pas interchangeables ni universels.</tspan><tspan x="82" dy="24">Documenter CV, métabolique, os, sexualité, préférence, prévention et date de fin prévue.</tspan></text>
<rect x="58" y="700" width="1260" height="42" rx="12" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="78" y="727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCE DES REPÈRES · RecoRad 2025 · confrontation EAU/CCAFU requise</text>
<text x="1298" y="727" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BBD8D2" text-anchor="end" letter-spacing="0">SYNTHÈSE ÉDUCATIVE · DONNÉES AGRÉGÉES</text>
</svg>
