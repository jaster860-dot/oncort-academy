<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">Raisonnement clinique — TEP-PSMA : chercher ce qui change la stratégie</title>
  <desc id="desc">Schéma en 4 étapes pour tep-psma : chercher ce qui change la stratégie : Question clinique, puis TEP-PSMA au bon moment, puis Résultat contextualisé, puis Décision modifiée ou non.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 z" fill="#24313A"/></marker>
  </defs>
  <rect width="1376" height="768" fill="#FFF8E8"/>
  <rect x="0" y="0" width="18" height="768" fill="#007C83"/>
  <text x="62" y="62" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750" fill="#007C83" letter-spacing="2">ONCORT ACADEMY · PROSTATE</text>
  <text x="62" y="116" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="62" dy="0">TEP-PSMA : chercher ce qui change la stratégie</tspan></text>
  <text x="62" y="204" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#24313A">Chaîne de raisonnement — chaque étape garde sa question et ses limites</text>
  <path d="M 340 403 H 374" stroke="#24313A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><g>
      <rect x="62" y="238" width="270" height="330" rx="24" fill="#DDF3F1" stroke="#007C83" stroke-width="4"/>
      <circle cx="104" cy="283" r="25" fill="#007C83"/>
      <text x="104" y="291" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="104" dy="0">01</tspan></text>
      <text x="90" y="350" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="90" dy="0">Question clinique</tspan></text>
      <line x1="90" y1="440" x2="304" y2="440" stroke="#007C83" stroke-width="2" stroke-dasharray="8 7"/>
      <text x="90" y="468" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#24313A" text-anchor="start"><tspan x="90" dy="0">Après prostatectomie, l&apos;EAU</tspan><tspan x="90" dy="21">recommande de considérer un</tspan><tspan x="90" dy="21">TEP-PSMA lorsque le PSA dépasse</tspan><tspan x="90" dy="21">0,2 ng/mL si le résultat doit</tspan><tspan x="90" dy="21">modifier…</tspan></text>
    </g>
<path d="M 664 403 H 698" stroke="#24313A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><g>
      <rect x="386" y="238" width="270" height="330" rx="24" fill="#E5EEF8" stroke="#2563A6" stroke-width="4"/>
      <circle cx="428" cy="283" r="25" fill="#2563A6"/>
      <text x="428" y="291" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="428" dy="0">02</tspan></text>
      <text x="414" y="350" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="414" dy="0">TEP-PSMA au bon moment</tspan></text>
      <line x1="414" y1="440" x2="628" y2="440" stroke="#2563A6" stroke-width="2" stroke-dasharray="8 7"/>
      <text x="414" y="468" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#24313A" text-anchor="start"><tspan x="414" dy="0">Le CCAFU rapporte une détection</tspan><tspan x="414" dy="21">d&apos;environ 38 % entre 0,2 et 0,5</tspan><tspan x="414" dy="21">ng/mL.</tspan></text>
    </g>
<path d="M 988 403 H 1022" stroke="#24313A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><g>
      <rect x="710" y="238" width="270" height="330" rx="24" fill="#FCE8C8" stroke="#D97706" stroke-width="4"/>
      <circle cx="752" cy="283" r="25" fill="#D97706"/>
      <text x="752" y="291" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="752" dy="0">03</tspan></text>
      <text x="738" y="350" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="738" dy="0">Résultat contextualisé</tspan></text>
      <line x1="738" y1="440" x2="952" y2="440" stroke="#D97706" stroke-width="2" stroke-dasharray="8 7"/>
      <text x="738" y="468" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#24313A" text-anchor="start"><tspan x="738" dy="0">Un TEP-PSMA négatif à faible</tspan><tspan x="738" dy="21">PSA n&apos;exclut pas une maladie</tspan><tspan x="738" dy="21">microscopique du lit</tspan><tspan x="738" dy="21">prostatique ou des ganglions.</tspan></text>
    </g>
<g>
      <rect x="1034" y="238" width="270" height="330" rx="24" fill="#FFFFFF" stroke="#24313A" stroke-width="4"/>
      <circle cx="1076" cy="283" r="25" fill="#24313A"/>
      <text x="1076" y="291" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="1076" dy="0">04</tspan></text>
      <text x="1062" y="350" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="1062" dy="0">Décision modifiée ou</tspan><tspan x="1062" dy="32">non</tspan></text>
      <line x1="1062" y1="440" x2="1276" y2="440" stroke="#24313A" stroke-width="2" stroke-dasharray="8 7"/>
      <text x="1062" y="468" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#24313A" text-anchor="start"><tspan x="1062" dy="0">Après prostatectomie, l&apos;EAU</tspan><tspan x="1062" dy="21">recommande de considérer un</tspan><tspan x="1062" dy="21">TEP-PSMA lorsque le PSA dépasse</tspan><tspan x="1062" dy="21">0,2 ng/mL si le résultat doit</tspan><tspan x="1062" dy="21">modifier…</tspan></text>
    </g>
  <rect x="62" y="624" width="1252" height="82" rx="18" fill="#24313A"/>
  <text x="91" y="658" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">SCHÉMA ÉDUCATIF · NEEDS_REVIEW</text>
  <text x="91" y="686" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="450" fill="#FFFFFF">Revue clinique nominative requise avant toute validation ou utilisation décisionnelle.</text>
