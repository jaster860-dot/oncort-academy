<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
<title id="title">Après prostatectomie : le TEP-PSMA doit répondre à une question</title>
<desc id="desc">Algorithme conditionnel du TEP-PSMA après prostatectomie, intégrant PSA, intention de modifier la stratégie, rendement de détection et limite d’un examen négatif.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24313A"/></marker></defs>
<rect width="1376" height="768" fill="#FFF8E8"/>
<rect width="18" height="768" fill="#007C83"/>
<text x="58" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="1.8">ONCORT ACADEMY · PROSTATE</text>
<rect x="58" y="51" width="340" height="32" rx="16" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="76" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.7">ALGORITHME D’UTILITÉ CLINIQUE</text>
<text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">Après prostatectomie : le TEP-PSMA doit répondre à une question</text>
<rect x="58" y="152" width="350" height="464" rx="18" fill="#FFFFFF" stroke="#007C83" stroke-width="3"/>
<text x="84" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#007C83" text-anchor="start" letter-spacing="0">1 · AVANT L’EXAMEN</text>
<text x="84" y="230" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="84" dy="0">PSA &gt; 0,2 ng/mL</tspan><tspan x="84" dy="35">ou persistant ascendant</tspan><tspan x="84" dy="35"></tspan><tspan x="84" dy="35">Question explicite :</tspan><tspan x="84" dy="35">• lit prostatique ?</tspan><tspan x="84" dy="35">• ganglions ?</tspan><tspan x="84" dy="35">• maladie distante ?</tspan></text>
<rect x="84" y="492" width="298" height="96" rx="14" fill="#F8DDD7" stroke="#C85C4A" stroke-width="2"/>
<text x="104" y="522" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#C85C4A" text-anchor="start"><tspan x="104" dy="0">Si le résultat ne change</tspan><tspan x="104" dy="23">pas la conduite :</tspan><tspan x="104" dy="23">ne pas ritualiser l’examen</tspan></text>
<rect x="438" y="152" width="400" height="464" rx="18" fill="#FFFFFF" stroke="#2563A6" stroke-width="3"/>
<text x="464" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#2563A6" text-anchor="start" letter-spacing="0">2 · RENDEMENT CONDITIONNEL</text>
<rect x="464" y="220" width="348" height="118" rx="16" fill="#E5EEF8" stroke="#2563A6" stroke-width="2"/>
<text x="638" y="254" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#24313A" text-anchor="middle" letter-spacing="0">PSA 0,2–0,5 ng/mL</text>
<text x="638" y="304" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#2563A6" text-anchor="middle" letter-spacing="0">≈ 38 %</text>
<text x="638" y="329" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="750" fill="#65717A" text-anchor="middle" letter-spacing="0">détection rapportée par le CCAFU</text>
<text x="464" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="464" dy="0">Tracer :</tspan><tspan x="464" dy="36">• radiotraceur et qualité</tspan><tspan x="464" dy="36">• sites suspects</tspan><tspan x="464" dy="36">• degré de certitude</tspan></text>
<rect x="868" y="152" width="426" height="464" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/>
<text x="894" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#D97706" text-anchor="start" letter-spacing="0">3 · INTERPRÉTER POUR AGIR</text>
<rect x="894" y="220" width="374" height="132" rx="15" fill="#DDF3F1" stroke="#007C83" stroke-width="2"/>
<text x="916" y="250" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#24313A" text-anchor="start"><tspan x="916" dy="0">POSITIF</tspan><tspan x="916" dy="25">Peut modifier volumes</tspan><tspan x="916" dy="25">ou stratégie — sans prouver</tspan><tspan x="916" dy="25">un bénéfice de survie</tspan></text>
<rect x="894" y="374" width="374" height="154" rx="15" fill="#F8DDD7" stroke="#C85C4A" stroke-width="2"/>
<text x="916" y="404" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#24313A" text-anchor="start"><tspan x="916" dy="0">NÉGATIF À FAIBLE PSA</tspan><tspan x="916" dy="23">N’exclut pas une maladie</tspan><tspan x="916" dy="23">microscopique du lit ou des N</tspan><tspan x="916" dy="23">et ne doit pas retarder un</tspan><tspan x="916" dy="23">salvage indiqué par le dossier</tspan></text>
<text x="1081" y="573" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#D97706" text-anchor="middle" letter-spacing="0">VISIBLE ≠ TOTALITÉ DE LA MALADIE</text>
<path d="M408 382 L438 382" stroke="#24313A" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M838 382 L868 382" stroke="#24313A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="58" y="642" width="1236" height="34" rx="10" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="676" y="665" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Le TEP informe la stratégie ; il ne remplace ni la cinétique du PSA ni la pathologie.</text>
<rect x="58" y="700" width="1260" height="42" rx="12" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="78" y="727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCES · EAU 2026 · CCAFU 2024–2026 · EANM/SNMMI 2023</text>
<text x="1298" y="727" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BBD8D2" text-anchor="end" letter-spacing="0">SYNTHÈSE ÉDUCATIVE · DONNÉES AGRÉGÉES</text>
</svg>
