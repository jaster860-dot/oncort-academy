<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">Radiothérapie postopératoire : reconstruire un lit sans glande</title>
  <desc id="desc">Lit prostatique sans glande pour « Radiothérapie postopératoire : reconstruire un lit sans glande ». Le schéma relie Pathologie et imagerie ; CTV du lit ; Dose et OAR ; IMRT/IGRT et validation sans représenter de données patient ni remplacer le protocole source.</desc>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6 z" fill="#24313A"/></marker></defs>
  <rect width="1376" height="768" fill="#FFF8E8"/>
  <rect width="18" height="768" fill="#007C83"/>
  <text x="60" y="46" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83" letter-spacing="2">ONCORT ACADEMY · PROSTATE</text>
  <rect x="60" y="62" width="304" height="34" rx="17" fill="#DDF3F1"/>
  <text x="77" y="85" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83">LIT PROSTATIQUE SANS GLANDE</text>
  <text x="60" y="132" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="60" dy="0">Radiothérapie postopératoire : reconstruire un lit sans</tspan><tspan x="60" dy="39">glande</tspan></text>
  <g><rect x="70" y="220" width="610" height="410" rx="24" fill="#FFFCF4" stroke="#24313A" stroke-width="3"/><ellipse cx="375" cy="305" rx="108" ry="62" fill="#E5EEF8" stroke="#2563A6" stroke-width="5"/><text x="375" y="312" font-family="Arial" font-size="17" font-weight="850" fill="#24313A" text-anchor="middle">Vessie</text><line x1="375" y1="365" x2="375" y2="575" stroke="#D97706" stroke-width="8"/><circle cx="375" cy="405" r="20" fill="#FFFFFF" stroke="#C85C4A" stroke-width="5"/><path d="M 270 390 Q 375 330 480 390 L 455 520 Q 375 565 295 520 Z" fill="none" stroke="#007C83" stroke-width="6" stroke-dasharray="12 8"/><text x="495" y="420" font-family="Arial" font-size="15" font-weight="850" fill="#007C83">Lit prostatique / CTV</text><text x="402" y="447" font-family="Arial" font-size="14" font-weight="800" fill="#C85C4A">Anastomose</text><ellipse cx="375" cy="580" rx="92" ry="25" fill="#F8DDD7" stroke="#C85C4A" stroke-width="4"/><text x="375" y="616" font-family="Arial" font-size="14" font-weight="750" fill="#C85C4A" text-anchor="middle">Rectum postérieur</text><g><rect x="720" y="220" width="586" height="112" rx="16" fill="#DDF3F1" stroke="#007C83" stroke-width="3"/>
    <text x="738" y="251" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#007C83" text-anchor="start"><tspan x="738" dy="0">Glande absente</tspan></text>
    <text x="738" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="738" dy="0">Le CTV du lit repose sur l’anatomie postopératoire, les</tspan><tspan x="738" dy="18">clips, le compte rendu et un atlas identifié.</tspan></text></g><g><rect x="720" y="352" width="586" height="112" rx="16" fill="#E5EEF8" stroke="#2563A6" stroke-width="3"/>
    <text x="738" y="383" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#2563A6" text-anchor="start"><tspan x="738" dy="0">Zones de vigilance</tspan></text>
    <text x="738" y="414" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="738" dy="0">Anastomose vésico-urétrale, col vésical, loge des</tspan><tspan x="738" dy="18">vésicules, apex et extension selon pT/marges.</tspan></text></g><g><rect x="720" y="484" width="586" height="112" rx="16" fill="#F8DDD7" stroke="#C85C4A" stroke-width="3"/>
    <text x="738" y="515" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#C85C4A" text-anchor="start"><tspan x="738" dy="0">Technique</tspan></text>
    <text x="738" y="546" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="738" dy="0">PTV, préparation et IGRT suivent les incertitudes du</tspan><tspan x="738" dy="18">workflow ; ne pas dessiner une ‘prostate fantôme’.</tspan></text></g></g>
  <rect x="60" y="688" width="1256" height="48" rx="14" fill="#24313A"/>
  <text x="84" y="718" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#FFFFFF">Lit prostatique sans glande · PÉDAGOGIQUE · NON À L’ÉCHELLE · SANS DONNÉE PATIENT</text>
  <text x="1290" y="718" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="650" fill="#BBD8D2" text-anchor="end">Sources et limites dans la leçon</text>
  </svg>
