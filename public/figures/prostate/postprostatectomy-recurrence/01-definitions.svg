<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">PSA postopératoire : nommer la situation avant de décider</title>
  <desc id="desc">Profils de PSA postopératoire pour « PSA postopératoire : nommer la situation avant de décider ». Le schéma relie PSA sériel ; Persistance ou remontée après nadir ; Contexte pathologique ; Discussion de rattrapage sans représenter de données patient ni remplacer le protocole source.</desc>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6 z" fill="#24313A"/></marker></defs>
  <rect width="1376" height="768" fill="#FFF8E8"/>
  <rect width="18" height="768" fill="#007C83"/>
  <text x="60" y="46" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83" letter-spacing="2">ONCORT ACADEMY · PROSTATE</text>
  <rect x="60" y="62" width="324" height="34" rx="17" fill="#DDF3F1"/>
  <text x="77" y="85" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83">PROFILS DE PSA POSTOPÉRATOIRE</text>
  <text x="60" y="132" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="60" dy="0">PSA postopératoire : nommer la situation avant de décider</tspan></text>
  <g><rect x="70" y="210" width="810" height="435" rx="22" fill="#FFFCF4" stroke="#24313A" stroke-width="3"/>
    <rect x="90" y="222" width="390" height="28" rx="14" fill="#FCE8C8"/><text x="285" y="241" font-family="Arial" font-size="13" font-weight="850" fill="#D97706" text-anchor="middle">TRAJECTOIRES SCHÉMATIQUES · AUCUNE DONNÉE PATIENT</text>
    <line x1="105" y1="595" x2="845" y2="595" stroke="#24313A" stroke-width="4" marker-end="url(#arrow)"/><line x1="105" y1="595" x2="105" y2="245" stroke="#24313A" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="845" y="627" font-family="Arial" font-size="15" font-weight="750" fill="#24313A" text-anchor="end">Temps</text><text x="55" y="280" font-family="Arial" font-size="15" font-weight="750" fill="#24313A" transform="rotate(-90 55 280)" text-anchor="end">PSA (ng/mL, schématique)</text>
    <path d="M 135 300 C 210 430 245 555 320 570 L 800 570" fill="none" stroke="#007C83" stroke-width="7"/><text x="455" y="552" font-family="Arial" font-size="15" font-weight="850" fill="#007C83">Nadir indétectable attendu</text>
    <path d="M 135 300 C 210 420 245 485 320 500 L 800 500" fill="none" stroke="#C85C4A" stroke-width="6" stroke-dasharray="14 8"/><text x="480" y="480" font-family="Arial" font-size="15" font-weight="850" fill="#C85C4A">Persistance : jamais indétectable</text>
    <path d="M 135 300 C 210 430 245 555 320 570 L 520 570 C 620 560 700 500 800 390" fill="none" stroke="#2563A6" stroke-width="6"/><text x="635" y="370" font-family="Arial" font-size="15" font-weight="850" fill="#2563A6">Récidive : remontée après nadir</text>
    <g><rect x="895" y="245" width="411" height="112" rx="16" fill="#DDF3F1" stroke="#007C83" stroke-width="3"/>
    <text x="913" y="276" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#007C83" text-anchor="start"><tspan x="913" dy="0">Définition opérationnelle</tspan></text>
    <text x="913" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="913" dy="0">Deux élévations consécutives &gt; 0,2</tspan><tspan x="913" dy="18">ng/mL dans RecoRad ; vérifier dates,</tspan><tspan x="913" dy="18">unités et répétition.</tspan></text></g><g><rect x="895" y="377" width="411" height="112" rx="16" fill="#E5EEF8" stroke="#2563A6" stroke-width="3"/>
    <text x="913" y="408" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#2563A6" text-anchor="start"><tspan x="913" dy="0">Définir ≠ attendre</tspan></text>
    <text x="913" y="439" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="913" dy="0">Un seuil standardise le dossier mais ne</tspan><tspan x="913" dy="18">fixe pas seul le meilleur moment d’un</tspan><tspan x="913" dy="18">rattrapage.</tspan></text></g><g><rect x="895" y="509" width="411" height="112" rx="16" fill="#F8DDD7" stroke="#C85C4A" stroke-width="3"/>
    <text x="913" y="540" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#C85C4A" text-anchor="start"><tspan x="913" dy="0">PSA ultrasensible</tspan></text>
    <text x="913" y="571" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="913" dy="0">Interpréter les très faibles valeurs</tspan><tspan x="913" dy="18">avec prudence et dans le contexte</tspan><tspan x="913" dy="18">anatomopathologique.</tspan></text></g></g>
  <rect x="60" y="688" width="1256" height="48" rx="14" fill="#24313A"/>
  <text x="84" y="718" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#FFFFFF">Profils de PSA postopératoire · PÉDAGOGIQUE · NON À L’ÉCHELLE · SANS DONNÉE PATIENT</text>
  <text x="1290" y="718" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="650" fill="#BBD8D2" text-anchor="end">Sources et limites dans la leçon</text>
  </svg>
