<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">Temps de doublement : mesurer une vitesse, pas fabriquer une certitude</title>
  <desc id="desc">Pente et temps de doublement pour « Temps de doublement : mesurer une vitesse, pas fabriquer une certitude ». Le schéma relie Dosages fiables ; Pente logarithmique ; Risque clinique intégré ; Urgence et intensité de la discussion sans représenter de données patient ni remplacer le protocole source.</desc>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6 z" fill="#24313A"/></marker></defs>
  <rect width="1376" height="768" fill="#FFF8E8"/>
  <rect width="18" height="768" fill="#007C83"/>
  <text x="60" y="46" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83" letter-spacing="2">ONCORT ACADEMY · PROSTATE</text>
  <rect x="60" y="62" width="314" height="34" rx="17" fill="#DDF3F1"/>
  <text x="77" y="85" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83">PENTE ET TEMPS DE DOUBLEMENT</text>
  <text x="60" y="132" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="60" dy="0">Temps de doublement : mesurer une vitesse, pas fabriquer une</tspan><tspan x="60" dy="39">certitude</tspan></text>
  <g><rect x="70" y="210" width="810" height="435" rx="22" fill="#FFFCF4" stroke="#24313A" stroke-width="3"/>
    <rect x="90" y="222" width="390" height="28" rx="14" fill="#FCE8C8"/><text x="285" y="241" font-family="Arial" font-size="13" font-weight="850" fill="#D97706" text-anchor="middle">MODÈLE DE PENTE · POINTS FICTIFS NON QUANTIFIÉS</text>
    <line x1="105" y1="595" x2="845" y2="595" stroke="#24313A" stroke-width="4" marker-end="url(#arrow)"/><line x1="105" y1="595" x2="105" y2="245" stroke="#24313A" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="845" y="627" font-family="Arial" font-size="15" font-weight="750" fill="#24313A" text-anchor="end">Temps</text><text x="55" y="280" font-family="Arial" font-size="15" font-weight="750" fill="#24313A" transform="rotate(-90 55 280)" text-anchor="end">ln(PSA)</text>
    <path d="M 150 555 L 780 300" fill="none" stroke="#C85C4A" stroke-width="7"/><path d="M 150 555 L 780 455" fill="none" stroke="#007C83" stroke-width="6" stroke-dasharray="14 8"/><circle cx="180" cy="543" r="8" fill="#FFFCF4" stroke="#C85C4A" stroke-width="4"/><circle cx="300" cy="495" r="8" fill="#FFFCF4" stroke="#C85C4A" stroke-width="4"/><circle cx="430" cy="445" r="8" fill="#FFFCF4" stroke="#C85C4A" stroke-width="4"/><circle cx="560" cy="390" r="8" fill="#FFFCF4" stroke="#C85C4A" stroke-width="4"/><circle cx="700" cy="332" r="8" fill="#FFFCF4" stroke="#C85C4A" stroke-width="4"/><rect x="173" y="543" width="14" height="14" fill="#FFFCF4" stroke="#007C83" stroke-width="4"/><rect x="313" y="523" width="14" height="14" fill="#FFFCF4" stroke="#007C83" stroke-width="4"/><rect x="463" y="498" width="14" height="14" fill="#FFFCF4" stroke="#007C83" stroke-width="4"/><rect x="613" y="478" width="14" height="14" fill="#FFFCF4" stroke="#007C83" stroke-width="4"/><rect x="753" y="451" width="14" height="14" fill="#FFFCF4" stroke="#007C83" stroke-width="4"/><text x="560" y="350" font-family="Arial" font-size="15" font-weight="850" fill="#C85C4A">Pente plus forte → PSADT plus court</text><text x="570" y="520" font-family="Arial" font-size="15" font-weight="850" fill="#007C83">Pente plus faible → PSADT plus long</text>
    <g><rect x="895" y="245" width="411" height="112" rx="16" fill="#DDF3F1" stroke="#007C83" stroke-width="3"/>
    <text x="913" y="276" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#007C83" text-anchor="start"><tspan x="913" dy="0">Formule</tspan></text>
    <text x="913" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="913" dy="0">PSADT = ln(2) / pente de ln(PSA) en</tspan><tspan x="913" dy="18">fonction du temps.</tspan></text></g><g><rect x="895" y="377" width="411" height="112" rx="16" fill="#E5EEF8" stroke="#2563A6" stroke-width="3"/>
    <text x="913" y="408" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#2563A6" text-anchor="start"><tspan x="913" dy="0">Données nécessaires</tspan></text>
    <text x="913" y="439" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="913" dy="0">Plusieurs valeurs positives, datées,</tspan><tspan x="913" dy="18">comparables ; fenêtre et laboratoire</tspan><tspan x="913" dy="18">documentés.</tspan></text></g><g><rect x="895" y="509" width="411" height="112" rx="16" fill="#F8DDD7" stroke="#C85C4A" stroke-width="3"/>
    <text x="913" y="540" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#C85C4A" text-anchor="start"><tspan x="913" dy="0">Interprétation</tspan></text>
    <text x="913" y="571" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="913" dy="0">Une cinétique courte augmente l’urgence</tspan><tspan x="913" dy="18">d’évaluation mais ne prouve pas à elle</tspan><tspan x="913" dy="18">seule une maladie métastatique.</tspan></text></g></g>
  <rect x="60" y="688" width="1256" height="48" rx="14" fill="#24313A"/>
  <text x="84" y="718" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#FFFFFF">Pente et temps de doublement · PÉDAGOGIQUE · NON À L’ÉCHELLE · SANS DONNÉE PATIENT</text>
