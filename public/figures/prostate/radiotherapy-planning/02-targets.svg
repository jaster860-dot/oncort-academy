    <rect x="756" y="520" width="550" height="113" rx="18" fill="#FCE8C8" stroke="#D97706" stroke-width="3"/><text x="784" y="556" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="850" fill="#D97706" text-anchor="start"><tspan x="784" dy="0">3 · Pelvis ≠ prostate</tspan></text><text x="784" y="588" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="784" dy="0">Le volume ganglionnaire n’est ajouté que s’il est</tspan><tspan x="784" dy="20">indiqué et ne partage pas automatiquement la même</tspan><tspan x="784" dy="20">marge.</tspan></text>
