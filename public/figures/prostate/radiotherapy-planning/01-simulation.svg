  <text x="77" y="85" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83">ANATOMIE REPRODUCTIBLE</text>
  <text x="60" y="132" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="60" dy="0">Simulation : fabriquer une anatomie reproductible</tspan></text>
  <g>
