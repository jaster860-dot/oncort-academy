    <path d="M 329 330 Q 360 405 329 495" fill="none" stroke="#C85C4A" stroke-width="24" stroke-linecap="round"/><text x="318" y="522" font-family="Arial" font-size="15" font-weight="750" fill="#C85C4A" text-anchor="end">Rectum peu distendu</text>
