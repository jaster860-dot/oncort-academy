    <text x="88" y="617" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="88" dy="0">Corriger gaz/selles ou préparation, réévaluer puis répéter l’acquisition si nécessaire : l’IGRT ne corrige pas une</tspan><tspan x="88" dy="18">déformation majeure.</tspan></text></g>
