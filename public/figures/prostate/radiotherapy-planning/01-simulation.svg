<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">Simulation : fabriquer une anatomie reproductible</title>
  <desc id="desc">Anatomie reproductible pour « Simulation : fabriquer une anatomie reproductible ». Le schéma relie Préparation ; Géométrie reproductible ; Imagerie concordante ; Contourage fiable sans représenter de données patient ni remplacer le protocole source.</desc>
