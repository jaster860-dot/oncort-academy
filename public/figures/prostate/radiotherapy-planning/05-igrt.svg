    <path d="M 610 402 L 760 402" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="685" y="378" font-family="Arial" font-size="14" font-weight="800" fill="#D97706" text-anchor="middle">Comparer</text>
    <rect x="780" y="225" width="526" height="355" rx="24" fill="#FFFCF4" stroke="#007C83" stroke-width="3"/><text x="1043" y="263" font-family="Arial" font-size="18" font-weight="850" fill="#007C83" text-anchor="middle">2 · REPÈRE PROSTATIQUE</text>
    <ellipse cx="1043" cy="365" rx="118" ry="76" fill="#DDF3F1" stroke="#007C83" stroke-width="5"/><ellipse cx="1070" cy="384" rx="118" ry="76" fill="none" stroke="#D97706" stroke-width="5" stroke-dasharray="11 8"/><circle cx="1005" cy="350" r="7" fill="#24313A"/><circle cx="1080" cy="350" r="7" fill="#24313A"/><circle cx="1045" cy="398" r="7" fill="#24313A"/><text x="1043" y="485" font-family="Arial" font-size="15" font-weight="750" fill="#24313A" text-anchor="middle">Prostate / fiduciels ou CBCT</text><text x="1043" y="526" font-family="Arial" font-size="14" font-weight="700" fill="#D97706" text-anchor="middle">Décalage possible après le match osseux</text>
    <g><rect x="70" y="600" width="1236" height="112" rx="16" fill="#F8DDD7" stroke="#C85C4A" stroke-width="3"/>
    <text x="88" y="631" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#C85C4A" text-anchor="start"><tspan x="88" dy="0">Si les corrections divergent</tspan></text>
    <text x="88" y="662" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="88" dy="0">Appliquer les tolérances du protocole : ordre des recalages, couverture des deux cibles, reprise</tspan><tspan x="88" dy="18">d’image/repositionnement et contrôle intrafraction documentés.</tspan></text></g>
