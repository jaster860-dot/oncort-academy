<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">IGRT : corriger la bonne cible au bon moment</title>
  <desc id="desc">Correction guidée par l’image pour « IGRT : corriger la bonne cible au bon moment ». Le schéma relie Image ; Recalage de la cible pertinente ; Contrôle intrafraction ; Action documentée sans représenter de données patient ni remplacer le protocole source.</desc>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6 z" fill="#24313A"/></marker></defs>
  <rect width="1376" height="768" fill="#FFF8E8"/>
  <rect width="18" height="768" fill="#007C83"/>
  <text x="60" y="46" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83" letter-spacing="2">ONCORT ACADEMY · PROSTATE</text>
  <rect x="60" y="62" width="324" height="34" rx="17" fill="#DDF3F1"/>
  <text x="77" y="85" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83">CORRECTION GUIDÉE PAR L’IMAGE</text>
  <text x="60" y="132" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="60" dy="0">IGRT : corriger la bonne cible au bon moment</tspan></text>
  <g>
    <rect x="70" y="225" width="520" height="355" rx="24" fill="#FFFCF4" stroke="#2563A6" stroke-width="3"/><text x="330" y="263" font-family="Arial" font-size="18" font-weight="850" fill="#2563A6" text-anchor="middle">1 · REPÈRE PELVIEN</text>
