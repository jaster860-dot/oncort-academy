    <text x="848" y="277" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="848" dy="0">PTV V57 ≥ 99 % ; CTV V60 ≥ 99 % ; PTV D1 cm³</tspan><tspan x="848" dy="18">≤ 63 Gy.</tspan></text></g>
    <g><rect x="830" y="347" width="476" height="112" rx="16" fill="#E5EEF8" stroke="#2563A6" stroke-width="3"/>
    <text x="848" y="378" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#2563A6" text-anchor="start"><tspan x="848" dy="0">60 Gy en 20 fractions — OAR</tspan></text>
    <text x="848" y="409" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="848" dy="0">Rectum V46 &lt; 30 %, V37 &lt; 50 % ; vessie V60 &lt;</tspan><tspan x="848" dy="18">5 %, V48 &lt; 25 %, V41 ≤ 50 %.</tspan></text></g>
    <g><rect x="830" y="479" width="476" height="112" rx="16" fill="#FCE8C8" stroke="#D97706" stroke-width="3"/>
    <text x="848" y="510" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#D97706" text-anchor="start"><tspan x="848" dy="0">36,25 Gy en 5 fractions ≠ même jeu</tspan></text>
    <text x="848" y="541" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="848" dy="0">Rectum D1 cm³ &lt; 36 Gy ; vessie V37 &lt; 10 cm³ ;</tspan><tspan x="848" dy="18">urètre V42 &lt; 50 %. Ne pas mélanger.</tspan></text></g>
  </g>
