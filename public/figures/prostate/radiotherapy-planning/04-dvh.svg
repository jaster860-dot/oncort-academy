<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">DVH et distribution : relier chaque seuil à son protocole</title>
  <desc id="desc">Courbes dose–volume pour « DVH et distribution : relier chaque seuil à son protocole ». Le schéma relie Protocole ; Structures concordantes ; DVH ; Inspection spatiale et décision sans représenter de données patient ni remplacer le protocole source.</desc>
