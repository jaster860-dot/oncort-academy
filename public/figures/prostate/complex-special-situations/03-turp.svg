<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">Après TURP : reconstruire l&apos;anatomie et le risque urinaire</title>
  <desc id="desc">Anatomie après TURP pour « Après TURP : reconstruire l&apos;anatomie et le risque urinaire ». Le schéma relie TURP et délai ; Fonction et anatomie ; Modalité RT ; Risque urinaire suivi sans représenter de données patient ni remplacer le protocole source.</desc>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6 z" fill="#24313A"/></marker></defs>
  <rect width="1376" height="768" fill="#FFF8E8"/>
  <rect width="18" height="768" fill="#007C83"/>
  <text x="60" y="46" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83" letter-spacing="2">ONCORT ACADEMY · PROSTATE</text>
  <rect x="60" y="62" width="224" height="34" rx="17" fill="#DDF3F1"/>
  <text x="77" y="85" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83">ANATOMIE APRÈS TURP</text>
  <text x="60" y="132" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="60" dy="0">Après TURP : reconstruire l&apos;anatomie et le risque urinaire</tspan></text>
  <g><rect x="70" y="220" width="560" height="410" rx="24" fill="#FFFCF4" stroke="#24313A" stroke-width="3"/><ellipse cx="350" cy="308" rx="105" ry="55" fill="#E5EEF8" stroke="#2563A6" stroke-width="5"/><text x="350" y="314" font-family="Arial" font-size="16" font-weight="800" fill="#24313A" text-anchor="middle">Vessie / col</text><path d="M 230 420 Q 350 340 470 420 L 450 545 Q 350 610 250 545 Z" fill="#DDF3F1" stroke="#007C83" stroke-width="5"/><path d="M 321 415 Q 350 380 379 415 L 388 505 Q 350 535 312 505 Z" fill="#FFF8E8" stroke="#C85C4A" stroke-width="5" stroke-dasharray="9 6"/><line x1="350" y1="365" x2="350" y2="590" stroke="#D97706" stroke-width="7"/><text x="396" y="477" font-family="Arial" font-size="15" font-weight="850" fill="#C85C4A">Cavité TURP</text><text x="365" y="575" font-family="Arial" font-size="14" font-weight="750" fill="#D97706">Urètre / sphincter</text><g><rect x="670" y="220" width="636" height="112" rx="16" fill="#E5EEF8" stroke="#2563A6" stroke-width="3"/>
    <text x="688" y="251" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#2563A6" text-anchor="start"><tspan x="688" dy="0">Avant RT</tspan></text>
    <text x="688" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="688" dy="0">Date et étendue de la résection, cicatrisation, continence,</tspan><tspan x="688" dy="18">obstruction, infection et débit urinaire.</tspan></text></g><g><rect x="670" y="352" width="636" height="112" rx="16" fill="#DDF3F1" stroke="#007C83" stroke-width="3"/>
    <text x="688" y="383" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#007C83" text-anchor="start"><tspan x="688" dy="0">Au contourage</tspan></text>
    <text x="688" y="414" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="688" dy="0">Visualiser col, urètre, sphincter et cavité si la</tspan><tspan x="688" dy="18">technique/protocole le prévoit ; ne pas inventer de</tspan><tspan x="688" dy="18">contrainte.</tspan></text></g><g><rect x="670" y="484" width="636" height="112" rx="16" fill="#F8DDD7" stroke="#C85C4A" stroke-width="3"/>
    <text x="688" y="515" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#C85C4A" text-anchor="start"><tspan x="688" dy="0">Arbitrage</tspan></text>
    <text x="688" y="546" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="688" dy="0">Risque urinaire dépend de l’anatomie résiduelle, des</tspan><tspan x="688" dy="18">symptômes, de la dose et du délai ; plan individualisé.</tspan></text></g></g>
  <rect x="60" y="688" width="1256" height="48" rx="14" fill="#24313A"/>
  <text x="84" y="718" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#FFFFFF">Anatomie après TURP · PÉDAGOGIQUE · NON À L’ÉCHELLE · SANS DONNÉE PATIENT</text>
  <text x="1290" y="718" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="650" fill="#BBD8D2" text-anchor="end">Sources et limites dans la leçon</text>
  </svg>
