  <g><rect x="70" y="220" width="520" height="410" rx="24" fill="#FFFCF4" stroke="#24313A" stroke-width="3"/><text x="330" y="255" font-family="Arial" font-size="17" font-weight="850" fill="#64727A" text-anchor="middle">TOPOGRAPHIE DIGESTIVE SCHÉMATIQUE</text><path d="M 190 330 Q 160 280 225 275 L 440 275 Q 505 280 470 335 L 470 500 Q 470 555 410 555 L 245 555 Q 190 555 190 500 Z" fill="none" stroke="#2563A6" stroke-width="28" stroke-linecap="round"/><path d="M 455 405 Q 480 450 450 505" fill="none" stroke="#C85C4A" stroke-width="28" stroke-linecap="round"/><circle cx="452" cy="455" r="32" fill="none" stroke="#D97706" stroke-width="6" stroke-dasharray="8 6"/><text x="330" y="595" font-family="Arial" font-size="15" font-weight="800" fill="#C85C4A" text-anchor="middle">Segment actif / sténose / anastomose à localiser</text><g><rect x="630" y="220" width="676" height="112" rx="16" fill="#F8DDD7" stroke="#C85C4A" stroke-width="3"/>
    <text x="648" y="251" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#C85C4A" text-anchor="start"><tspan x="648" dy="0">1 · Activité et anatomie</tspan></text>
    <text x="648" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="648" dy="0">Type de MICI, activité récente, symptômes, biologie/endoscopie</tspan><tspan x="648" dy="18">utile, chirurgie, sténose ou fistule.</tspan></text></g><g><rect x="630" y="352" width="676" height="112" rx="16" fill="#E5EEF8" stroke="#2563A6" stroke-width="3"/>
    <text x="648" y="383" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#2563A6" text-anchor="start"><tspan x="648" dy="0">2 · Volume exposé</tspan></text>
    <text x="648" y="414" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="648" dy="0">Distinguer rectum, canal anal, anses et bowel bag ; antécédents</tspan><tspan x="648" dy="18">pelviens et topographie comptent.</tspan></text></g><g><rect x="630" y="484" width="676" height="112" rx="16" fill="#DDF3F1" stroke="#007C83" stroke-width="3"/>
    <text x="648" y="515" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#007C83" text-anchor="start"><tspan x="648" dy="0">3 · Réduire le risque</tspan></text>
    <text x="648" y="546" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="648" dy="0">Préparation reproductible, modulation/IGRT, contraintes</tspan><tspan x="648" dy="18">concordantes, gastro-entérologie et surveillance renforcée.</tspan></text></g></g>
