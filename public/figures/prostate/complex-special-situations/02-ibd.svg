<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">MICI : qualifier l&apos;activité et réduire l&apos;exposition digestive</title>
  <desc id="desc">Carte anatomique digestive pour « MICI : qualifier l&apos;activité et réduire l&apos;exposition digestive ». Le schéma relie MICI et activité ; Risque digestif individuel ; Option et technique ; Surveillance gastro-oncologique sans représenter de données patient ni remplacer le protocole source.</desc>
