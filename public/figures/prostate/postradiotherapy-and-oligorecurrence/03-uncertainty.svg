<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
<title id="title">MDT : des critères intermédiaires, pas une preuve de guérison</title>
<desc id="desc">Deux panneaux séparés résument STOMP et RADIOSA avec leurs populations, comparateurs et critères de jugement distincts, puis listent ce qui reste non démontré.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24313A"/></marker></defs>
<rect width="1376" height="768" fill="#FFF8E8"/>
<rect width="18" height="768" fill="#007C83"/>
<text x="58" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="1.8">ONCORT ACADEMY · PROSTATE</text>
<rect x="58" y="51" width="340" height="32" rx="16" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="76" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.7">LECTURE CRITIQUE D’ESSAIS</text>
<text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">MDT : des critères intermédiaires, pas une preuve de guérison</text>
<rect x="58" y="150" width="604" height="390" rx="18" fill="#FFFFFF" stroke="#2563A6" stroke-width="3"/>
<text x="84" y="184" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#2563A6" text-anchor="start" letter-spacing="0.8">STOMP · PHASE II</text>
<text x="84" y="216" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#65717A" text-anchor="start" letter-spacing="0">≤ 3 lésions · TEP-choline · n = 62</text>
<rect x="84" y="244" width="552" height="62" rx="14" fill="#E5EEF8" stroke="#2563A6" stroke-width="2"/>
<text x="104" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="850" fill="#2563A6" text-anchor="start" letter-spacing="0.7">CRITÈRE</text>
<text x="104" y="294" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Survie sans ADT</text>
<text x="84" y="346" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24313A" text-anchor="start" letter-spacing="0">Surveillance</text>
<rect x="236" y="328" width="180" height="26" rx="8" fill="#D8D5C9" stroke="#D8D5C9" stroke-width="0"/>
<text x="474" y="348" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">13 mois</text>
<text x="84" y="393" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#2563A6" text-anchor="start" letter-spacing="0">MDT tous sites</text>
<rect x="236" y="375" width="290" height="26" rx="8" fill="#2563A6" stroke="#2563A6" stroke-width="0"/>
<text x="613" y="395" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#2563A6" text-anchor="end" letter-spacing="0">21 mois</text>
<text x="84" y="445" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="850" fill="#2563A6" text-anchor="start" letter-spacing="0">HR 0,60 · IC à 80 %</text>
<text x="84" y="482" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#C85C4A" text-anchor="start"><tspan x="84" dy="0">Signal exploratoire : délai avant ADT</tspan><tspan x="84" dy="22">≠ preuve de survie globale</tspan></text>
<rect x="714" y="150" width="604" height="390" rx="18" fill="#FFFFFF" stroke="#007C83" stroke-width="3"/>
<text x="740" y="184" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#007C83" text-anchor="start" letter-spacing="0.8">RADIOSA · PHASE II</text>
<text x="740" y="216" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#65717A" text-anchor="start" letter-spacing="0">≤ 3 lésions · n = 105</text>
<rect x="740" y="244" width="552" height="62" rx="14" fill="#DDF3F1" stroke="#007C83" stroke-width="2"/>
<text x="760" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="850" fill="#007C83" text-anchor="start" letter-spacing="0.7">CRITÈRE</text>
<text x="760" y="294" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Survie sans progression clinique</text>
<text x="740" y="346" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24313A" text-anchor="start" letter-spacing="0">SBRT seule</text>
<rect x="892" y="328" width="141" height="26" rx="8" fill="#D8D5C9" stroke="#D8D5C9" stroke-width="0"/>
<text x="1125" y="348" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">15,1 mois</text>
<text x="740" y="393" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#007C83" text-anchor="start" letter-spacing="0">SBRT + ADT 6 m</text>
<rect x="892" y="375" width="300" height="26" rx="8" fill="#007C83" stroke="#007C83" stroke-width="0"/>
<text x="1275" y="395" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#007C83" text-anchor="end" letter-spacing="0">32,2 mois</text>
<text x="740" y="445" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="850" fill="#007C83" text-anchor="start" letter-spacing="0">HR 0,43</text>
<text x="740" y="482" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#C85C4A" text-anchor="start"><tspan x="740" dy="0">L’ADT modifie la stratégie testée</tspan><tspan x="740" dy="22">durée optimale et OS non établies</tspan></text>
<rect x="58" y="564" width="1260" height="112" rx="16" fill="#F8DDD7" stroke="#C85C4A" stroke-width="2"/>
<text x="82" y="595" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#C85C4A" text-anchor="start" letter-spacing="0.8">NE PAS CONFONDRE</text>
<text x="82" y="624" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="82" dy="0">Contrôle local / délai sans ADT / survie sans progression ≠ survie globale ni guérison.</tspan><tspan x="82" dy="24">Les critères, l’imagerie et le traitement systémique diffèrent : les deux barres ne sont pas une comparaison entre essais.</tspan></text>
<rect x="58" y="700" width="1260" height="42" rx="12" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="78" y="727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCES · STOMP 2018 · RADIOSA 2025 · résultats agrégés publiés</text>
<text x="1298" y="727" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BBD8D2" text-anchor="end" letter-spacing="0">SYNTHÈSE ÉDUCATIVE · DONNÉES AGRÉGÉES</text>
</svg>
