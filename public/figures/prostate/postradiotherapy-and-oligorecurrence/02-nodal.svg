<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">Récidive ganglionnaire : la cible visible n&apos;est pas tout le pelvis à risque</title>
  <desc id="desc">Cible visible et territoire ganglionnaire pour « Récidive ganglionnaire : la cible visible n&apos;est pas tout le pelvis à risque ». Le schéma relie Carte TEP et ancien plan ; Territoire à risque ; MDT ou électif + boost ; ADT et suivi contextualisés sans représenter de données patient ni remplacer le protocole source.</desc>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6 z" fill="#24313A"/></marker></defs>
  <rect width="1376" height="768" fill="#FFF8E8"/>
  <rect width="18" height="768" fill="#007C83"/>
  <text x="60" y="46" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83" letter-spacing="2">ONCORT ACADEMY · PROSTATE</text>
  <rect x="60" y="62" width="444" height="34" rx="17" fill="#DDF3F1"/>
  <text x="77" y="85" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83">CIBLE VISIBLE ET TERRITOIRE GANGLIONNAIRE</text>
  <text x="60" y="132" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="60" dy="0">Récidive ganglionnaire : la cible visible n&apos;est pas tout le</tspan><tspan x="60" dy="39">pelvis à risque</tspan></text>
  <g><g><rect x="70" y="230" width="370" height="392" rx="22" fill="#FFFCF4" stroke="#C85C4A" stroke-width="3"/><text x="255" y="268" font-family="Arial" font-size="18" font-weight="850" fill="#C85C4A" text-anchor="middle">MDT focale</text><g><circle cx="359" cy="361" r="20" fill="#F8DDD7" stroke="#C85C4A" stroke-width="5"/><circle cx="359" cy="361" r="7" fill="#C85C4A"/></g><text x="98" y="552" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="98" dy="0">Traite le ou les ganglions visibles ;</tspan><tspan x="98" dy="19">volume réduit mais risque de maladie</tspan><tspan x="98" dy="19">microscopique voisine.</tspan></text></g><g><rect x="503" y="230" width="370" height="392" rx="22" fill="#FFFCF4" stroke="#2563A6" stroke-width="3"/><text x="688" y="268" font-family="Arial" font-size="18" font-weight="850" fill="#2563A6" text-anchor="middle">Irradiation élective + boost</text><g><path d="M 583 280 Q 533 395 583 510 M 793 280 Q 843 395 793 510" fill="none" stroke="#2563A6" stroke-width="13" stroke-linecap="round"/><path d="M 596 321 Q 546 395 596 470 M 780 321 Q 830 395 780 470" fill="none" stroke="#2563A6" stroke-width="5" stroke-dasharray="9 7"/><circle cx="792" cy="361" r="20" fill="#F8DDD7" stroke="#C85C4A" stroke-width="5"/><circle cx="792" cy="361" r="7" fill="#C85C4A"/></g><text x="531" y="552" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="531" dy="0">Traite les chaînes pelviennes à risque</tspan><tspan x="531" dy="19">et renforce les ganglions détectés ;</tspan><tspan x="531" dy="19">volume et toxicité plus grands.</tspan></text></g><rect x="936" y="230" width="370" height="392" rx="22" fill="#FFFCF4" stroke="#007C83" stroke-width="3"/><text x="1121" y="270" font-family="Arial" font-size="18" font-weight="850" fill="#007C83" text-anchor="middle">Avant de choisir</text><text x="974" y="322" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24313A" text-anchor="start"><tspan x="974" dy="0">Territoire N1 ou M1a ·</tspan><tspan x="974" dy="23">nombre/taille · PSADT ·</tspan><tspan x="974" dy="23">hormonosensibilité · irradiation</tspan><tspan x="974" dy="23">antérieure · dose cumulée · autres</tspan><tspan x="974" dy="23">sites.</tspan></text><rect x="974" y="520" width="294" height="70" rx="14" fill="#FCE8C8" stroke="#D97706" stroke-width="3"/><text x="994" y="548" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="994" dy="0">PEACE V–STORM : signal de phase</tspan><tspan x="994" dy="18">II, pas supériorité définitive.</tspan></text></g>
  <rect x="60" y="688" width="1256" height="48" rx="14" fill="#24313A"/>
