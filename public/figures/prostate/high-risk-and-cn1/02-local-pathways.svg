<title id="title">Haut risque cN0 : comparer des parcours réellement multimodaux</title>
<desc id="desc">Trois colonnes comparent radio-hormonothérapie, chirurgie sélectionnée et ADT seule, en distinguant socle, conséquences anticipées et statut d’exception.</desc>
