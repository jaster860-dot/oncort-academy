      <text x="90" y="350" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="90" dy="0">Socle ADT</tspan></text>
      <line x1="90" y1="440" x2="304" y2="440" stroke="#007C83" stroke-width="2" stroke-dasharray="8 7"/>
      <text x="90" y="468" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#24313A" text-anchor="start"><tspan x="90" dy="0">L&apos;EAU recommande au moins deux</tspan><tspan x="90" dy="21">ans d&apos;ADT avec la radiothérapie</tspan><tspan x="90" dy="21">du cN0 localement avancé ; le</tspan><tspan x="90" dy="21">CCAFU rappelle que 18 mois</tspan><tspan x="90" dy="21">n&apos;était…</tspan></text>
    </g>
<path d="M 664 403 H 698" stroke="#24313A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><g>
      <rect x="386" y="238" width="270" height="330" rx="24" fill="#E5EEF8" stroke="#2563A6" stroke-width="4"/>
      <circle cx="428" cy="283" r="25" fill="#2563A6"/>
      <text x="428" y="291" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="428" dy="0">02</tspan></text>
      <text x="414" y="350" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="414" dy="0">Critères de très haut</tspan><tspan x="414" dy="32">risque/cN1</tspan></text>
      <line x1="414" y1="440" x2="628" y2="440" stroke="#2563A6" stroke-width="2" stroke-dasharray="8 7"/>
      <text x="414" y="468" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#24313A" text-anchor="start"><tspan x="414" dy="0">STAMPEDE M0 a ajouté deux ans</tspan><tspan x="414" dy="21">d&apos;abiratérone avec prednisone à</tspan><tspan x="414" dy="21">un socle d&apos;ADT prévu pour trois</tspan><tspan x="414" dy="21">ans.</tspan></text>
    </g>
<path d="M 988 403 H 1022" stroke="#24313A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><g>
      <rect x="710" y="238" width="270" height="330" rx="24" fill="#FCE8C8" stroke="#D97706" stroke-width="4"/>
      <circle cx="752" cy="283" r="25" fill="#D97706"/>
      <text x="752" y="291" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="752" dy="0">03</tspan></text>
      <text x="738" y="350" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="738" dy="0">Intensification fondée</tspan></text>
      <line x1="738" y1="440" x2="952" y2="440" stroke="#D97706" stroke-width="2" stroke-dasharray="8 7"/>
      <text x="738" y="468" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#24313A" text-anchor="start"><tspan x="738" dy="0">Les essais non métastatiques de</tspan><tspan x="738" dy="21">docétaxel ont produit des</tspan><tspan x="738" dy="21">résultats discordants, souvent</tspan><tspan x="738" dy="21">favorables sur la récidive mais</tspan><tspan x="738" dy="21">sans…</tspan></text>
    </g>
<g>
