      <text x="1062" y="350" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="1062" dy="0">Prévention, suivi et</tspan><tspan x="1062" dy="32">durée</tspan></text>
      <line x1="1062" y1="440" x2="1276" y2="440" stroke="#24313A" stroke-width="2" stroke-dasharray="8 7"/>
      <text x="1062" y="468" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#24313A" text-anchor="start"><tspan x="1062" dy="0">L&apos;EAU recommande au moins deux</tspan><tspan x="1062" dy="21">ans d&apos;ADT avec la radiothérapie</tspan><tspan x="1062" dy="21">du cN0 localement avancé ; le</tspan><tspan x="1062" dy="21">CCAFU rappelle que 18 mois</tspan><tspan x="1062" dy="21">n&apos;était…</tspan></text>
    </g>
  <rect x="62" y="624" width="1252" height="82" rx="18" fill="#24313A"/>
  <text x="91" y="658" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">SCHÉMA ÉDUCATIF · NEEDS_REVIEW</text>
  <text x="91" y="686" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="450" fill="#FFFFFF">Revue clinique nominative requise avant toute validation ou utilisation décisionnelle.</text>
