<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
<title id="title">Haut risque M0 : reproduire la population avant d’intensifier</title>
<desc id="desc">Algorithme STAMPEDE M0 distinguant cN1 conventionnel et cN0 avec au moins deux facteurs, puis montrant les durées d’ADT et d’abiratérone.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24313A"/></marker></defs>
<rect width="1376" height="768" fill="#FFF8E8"/>
<rect width="18" height="768" fill="#007C83"/>
<text x="58" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="1.8">ONCORT ACADEMY · PROSTATE</text>
<rect x="58" y="51" width="340" height="32" rx="16" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="76" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.7">FILTRE D’ÉLIGIBILITÉ + DURÉES</text>
<text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">Haut risque M0 : reproduire la population avant d’intensifier</text>
<rect x="58" y="148" width="468" height="520" rx="20" fill="#FFFFFF" stroke="#007C83" stroke-width="3"/>
<text x="82" y="181" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.8">1 · POPULATION DE L’ESSAI</text>
<rect x="82" y="198" width="420" height="54" rx="14" fill="#E5EEF8" stroke="#2563A6" stroke-width="2"/>
<text x="292" y="231" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#2563A6" text-anchor="middle" letter-spacing="0">M0 EN IMAGERIE CONVENTIONNELLE</text>
<text x="292" y="279" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#65717A" text-anchor="middle" letter-spacing="0">puis</text>
<rect x="82" y="296" width="170" height="92" rx="16" fill="#DDF3F1" stroke="#007C83" stroke-width="2"/>
<text x="167" y="329" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="850" fill="#007C83" text-anchor="middle" letter-spacing="0">cN1</text>
<text x="167" y="356" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24313A" text-anchor="middle" letter-spacing="0">conventionnel</text>
<text x="276" y="347" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="850" fill="#65717A" text-anchor="middle" letter-spacing="0">OU</text>
<rect x="310" y="296" width="192" height="92" rx="16" fill="#FCE8C8" stroke="#D97706" stroke-width="2"/>
<text x="406" y="329" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="850" fill="#D97706" text-anchor="middle" letter-spacing="0">cN0</text>
<text x="406" y="356" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#24313A" text-anchor="middle" letter-spacing="0">≥ 2 facteurs</text>
<rect x="82" y="411" width="420" height="132" rx="16" fill="#FFFCF4" stroke="#D8D5C9" stroke-width="2"/>
<text x="103" y="441" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#D97706" text-anchor="start" letter-spacing="0.8">FACTEURS cN0</text>
<text x="103" y="471" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#24313A" text-anchor="start"><tspan x="103" dy="0">• cT3–4</tspan><tspan x="103" dy="25">• ISUP 4–5</tspan><tspan x="103" dy="25">• PSA ≥ 40 ng/mL</tspan></text>
<rect x="82" y="566" width="420" height="72" rx="14" fill="#F8DDD7" stroke="#C85C4A" stroke-width="2"/>
<text x="103" y="593" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#C85C4A" text-anchor="start"><tspan x="103" dy="0">Un seul facteur haut risque</tspan><tspan x="103" dy="22">≠ population cN0 STAMPEDE</tspan></text>
<rect x="552" y="148" width="766" height="520" rx="20" fill="#FFFFFF" stroke="#2563A6" stroke-width="3"/>
<text x="578" y="181" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#2563A6" text-anchor="start" letter-spacing="0.8">2 · STRATÉGIE TESTÉE</text>
<text x="578" y="217" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#24313A" text-anchor="start" letter-spacing="0">Traitement local majoritairement radiothérapique</text>
<text x="1288" y="217" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="850" fill="#2563A6" text-anchor="end" letter-spacing="0">85 %</text>
<text x="578" y="263" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#65717A" text-anchor="start" letter-spacing="0.8">ANNÉE</text>
<text x="685" y="263" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#24313A" text-anchor="middle" letter-spacing="0">0</text>
<text x="906" y="263" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#24313A" text-anchor="middle" letter-spacing="0">1</text>
<text x="1127" y="263" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#24313A" text-anchor="middle" letter-spacing="0">2</text>
<text x="1275" y="263" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#24313A" text-anchor="middle" letter-spacing="0">3</text>
<line x1="685" y1="277" x2="1275" y2="277" stroke="#D8D5C9" stroke-width="3"/>
<line x1="685" y1="270" x2="685" y2="285" stroke="#24313A" stroke-width="2"/><line x1="906" y1="270" x2="906" y2="285" stroke="#24313A" stroke-width="2"/><line x1="1127" y1="270" x2="1127" y2="285" stroke="#24313A" stroke-width="2"/><line x1="1275" y1="270" x2="1275" y2="285" stroke="#24313A" stroke-width="2"/>
<text x="578" y="327" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="850" fill="#007C83" text-anchor="start" letter-spacing="0">ADT</text>
<rect x="685" y="302" width="590" height="42" rx="12" fill="#DDF3F1" stroke="#007C83" stroke-width="2"/>
<text x="980" y="329" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#007C83" text-anchor="middle" letter-spacing="0">prévue 3 ans dans STAMPEDE</text>
<text x="578" y="392" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="850" fill="#D97706" text-anchor="start" letter-spacing="0">ABI + P</text>
<rect x="685" y="367" width="442" height="42" rx="12" fill="#FCE8C8" stroke="#D97706" stroke-width="2"/>
<text x="906" y="394" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#D97706" text-anchor="middle" letter-spacing="0">abiratérone + prednisone · 2 ans</text>
<rect x="578" y="450" width="710" height="86" rx="15" fill="#E5EEF8" stroke="#2563A6" stroke-width="2"/>
<text x="601" y="480" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#2563A6" text-anchor="start"><tspan x="601" dy="0">Bénéfice démontré dans cette population</tspan><tspan x="601" dy="25">sur survie sans métastase et survie globale</tspan></text>
<rect x="578" y="558" width="710" height="80" rx="15" fill="#F8DDD7" stroke="#C85C4A" stroke-width="2"/>
<text x="601" y="587" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#C85C4A" text-anchor="start"><tspan x="601" dy="0">Ne pas extrapoler à tout « haut risque »</tspan><tspan x="601" dy="23">Docétaxel M0 : pas de routine dans le référentiel cité</tspan></text>
<rect x="58" y="700" width="1260" height="42" rx="12" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="78" y="727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCE · STAMPEDE M0, Lancet 2022 · seuils et durées propres à l’essai</text>
<text x="1298" y="727" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BBD8D2" text-anchor="end" letter-spacing="0">SYNTHÈSE ÉDUCATIVE · DONNÉES AGRÉGÉES</text>
</svg>
