  <title id="title">cN1 M0 : traiter le pelvis, la prostate et le risque systémique</title>
  <desc id="desc">Carte prostate–pelvis–ganglion pour « cN1 M0 : traiter le pelvis, la prostate et le risque systémique ». Le schéma relie cN1 régional et M0 ; Prostate + pelvis + boost ; ADT longue + intensification ; Surveillance oncologique et toxicités sans représenter de données patient ni remplacer le protocole source.</desc>
