<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">Escalade et boost focal : intensifier sans sacrifier les organes à risque</title>
  <desc id="desc">Carte de boost focal pour « Escalade et boost focal : intensifier sans sacrifier les organes à risque ». Le schéma relie Risque de contrôle local ; Lésion dominante vérifiée ; Technique de boost ; Contraintes et bénéfice attendu sans représenter de données patient ni remplacer le protocole source.</desc>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6 z" fill="#24313A"/></marker></defs>
  <rect width="1376" height="768" fill="#FFF8E8"/>
  <rect width="18" height="768" fill="#007C83"/>
  <text x="60" y="46" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83" letter-spacing="2">ONCORT ACADEMY · PROSTATE</text>
  <rect x="60" y="62" width="234" height="34" rx="17" fill="#DDF3F1"/>
  <text x="77" y="85" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83">CARTE DE BOOST FOCAL</text>
  <text x="60" y="132" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="60" dy="0">Escalade et boost focal : intensifier sans sacrifier les</tspan><tspan x="60" dy="39">organes à risque</tspan></text>
  <g><g><rect x="70" y="230" width="370" height="392" rx="22" fill="#FFFCF4" stroke="#007C83" stroke-width="3"/><text x="255" y="268" font-family="Arial" font-size="18" font-weight="850" fill="#007C83" text-anchor="middle">Escalade glandulaire</text><g><path d="M 177 385 Q 255 333 333 385 L 320 477 Q 255 513 190 477 Z" fill="#DDF3F1" stroke="#007C83" stroke-width="5"/></g><text x="98" y="552" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="98" dy="0">Dose augmentée à toute la prostate :</tspan><tspan x="98" dy="19">bénéfice surtout biochimique ;</tspan><tspan x="98" dy="19">contraintes OAR prioritaires.</tspan></text></g><g><rect x="503" y="230" width="370" height="392" rx="22" fill="#FFFCF4" stroke="#C85C4A" stroke-width="3"/><text x="688" y="268" font-family="Arial" font-size="18" font-weight="850" fill="#C85C4A" text-anchor="middle">Boost focal externe</text><g><path d="M 610 385 Q 688 333 766 385 L 753 477 Q 688 513 623 477 Z" fill="#DDF3F1" stroke="#007C83" stroke-width="5"/><path d="M 696 400 q 35 -28 54 2 q -5 45 -48 48 q -27 -20 -6 -50" fill="#F8DDD7" stroke="#C85C4A" stroke-width="4"/></g><text x="531" y="552" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="531" dy="0">DIL définie par IRM, IMRT + IGRT ;</tspan><tspan x="531" dy="19">cible nommée, distribution vérifiée,</tspan><tspan x="531" dy="19">pas de bénéfice de survie affirmé.</tspan></text></g><g><rect x="936" y="230" width="370" height="392" rx="22" fill="#FFFCF4" stroke="#D97706" stroke-width="3"/><text x="1121" y="268" font-family="Arial" font-size="18" font-weight="850" fill="#D97706" text-anchor="middle">Boost curiethérapique</text><g><path d="M 1043 385 Q 1121 333 1199 385 L 1186 477 Q 1121 513 1056 477 Z" fill="#DDF3F1" stroke="#007C83" stroke-width="5"/><path d="M 1129 400 q 35 -28 54 2 q -5 45 -48 48 q -27 -20 -6 -50" fill="#F8DDD7" stroke="#C85C4A" stroke-width="4"/></g><text x="964" y="552" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="964" dy="0">Modalité, preuve et toxicité</tspan><tspan x="964" dy="19">différentes : ne pas la confondre avec</tspan><tspan x="964" dy="19">un boost focal externe.</tspan></text></g><text x="688" y="660" font-family="Arial" font-size="14" font-weight="800" fill="#24313A" text-anchor="middle">Trois intensifications différentes → trois prescriptions et trois arbitrages spécifiques.</text></g>
  <rect x="60" y="688" width="1256" height="48" rx="14" fill="#24313A"/>
  <text x="84" y="718" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#FFFFFF">Carte de boost focal · PÉDAGOGIQUE · NON À L’ÉCHELLE · SANS DONNÉE PATIENT</text>
  <text x="1290" y="718" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="650" fill="#BBD8D2" text-anchor="end">Sources et limites dans la leçon</text>
  </svg>
