<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
<title id="title">ADT avec RT : durée, calendrier et prévention forment une prescription</title>
<desc id="desc">Matrice des durées d’ADT avec radiothérapie définitive selon risque, suivie d’une checklist de prescription et de prévention.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24313A"/></marker></defs>
<rect width="1376" height="768" fill="#FFF8E8"/>
<rect width="18" height="768" fill="#007C83"/>
<text x="58" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="1.8">ONCORT ACADEMY · PROSTATE</text>
<rect x="58" y="51" width="340" height="32" rx="16" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="76" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.7">MATRICE DE DURÉE + SÉCURITÉ</text>
<text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">ADT avec RT : durée, calendrier et prévention forment une prescription</text>
<rect x="58" y="152" width="1236" height="248" rx="18" fill="#FFFFFF" stroke="#007C83" stroke-width="3"/>
<rect x="58" y="152" width="1236" height="56" rx="18" fill="#24313A"/>
<text x="80" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0">GROUPE</text>
<text x="420" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0">ADT AVEC RT</text>
<text x="760" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0">REPÈRE</text>
<text x="1010" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0">LIMITE</text>
<rect x="59" y="208" width="1234" height="64" fill="#DDF3F1" opacity="0.75"/>
<text x="80" y="247" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Faible / intermédiaire favorable</text>
<text x="420" y="247" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Généralement non</text>
<text x="760" y="247" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">—</text>
<text x="1010" y="247" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Ne pas sous-classer pour l’omettre</text>
<rect x="59" y="272" width="1234" height="64" fill="#FCE8C8" opacity="0.75"/>
<text x="80" y="311" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Intermédiaire défavorable</text>
<text x="420" y="311" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Courte</text>
<text x="760" y="311" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">4–6 mois</text>
<text x="1010" y="311" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Contexte et vulnérabilités</text>
<rect x="59" y="336" width="1234" height="64" fill="#F8DDD7" opacity="0.75"/>
<text x="80" y="375" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Haut risque</text>
<text x="420" y="375" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Longue</text>
<text x="760" y="375" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">18–36 m ; 2–3 ans</text>
<text x="1010" y="375" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">36 m non &gt; 18 m dans l’essai cité</text>
<rect x="58" y="430" width="1236" height="174" rx="17" fill="#E5EEF8" stroke="#2563A6" stroke-width="2"/>
<text x="82" y="465" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#2563A6" text-anchor="start" letter-spacing="0">PRESCRIPTION COMPLÈTE</text>
<text x="82" y="500" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="82" dy="0">Classe / molécule · date de début · position par rapport à la RT · durée cible · date de fin prévue</tspan><tspan x="82" dy="31">Prévention osseuse et métabolique · risque CV · santé sexuelle · surveillance · critères d’adaptation</tspan></text>
<rect x="58" y="628" width="1236" height="48" rx="12" fill="#F8DDD7" stroke="#C85C4A" stroke-width="2"/>
<text x="676" y="658" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#24313A" text-anchor="middle" letter-spacing="0">Abiratérone dans certains très hauts risques / cN1 : critères spécifiques du bloc haut risque, jamais déduction automatique.</text>
<rect x="58" y="700" width="1260" height="42" rx="12" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="78" y="727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCES · RecoRad 2025 · CCAFU 2024–2026 · EAU 2026 · ESTRO-ACROP 2023</text>
<text x="1298" y="727" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BBD8D2" text-anchor="end" letter-spacing="0">SYNTHÈSE ÉDUCATIVE · DONNÉES AGRÉGÉES</text>
</svg>
