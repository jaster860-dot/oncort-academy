<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">Ultra-hypofractionnement : sélectionner avant d&apos;accélérer</title>
  <desc id="desc">Calendrier stéréotaxique pour « Ultra-hypofractionnement : sélectionner avant d&apos;accélérer ». Le schéma relie Risque favorable ou intermédiaire ; Fonction urinaire compatible ; Technique stéréotaxique et IGRT ; Cinq ou sept fractions validées sans représenter de données patient ni remplacer le protocole source.</desc>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6 z" fill="#24313A"/></marker></defs>
  <rect width="1376" height="768" fill="#FFF8E8"/>
  <rect width="18" height="768" fill="#007C83"/>
  <text x="60" y="46" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83" letter-spacing="2">ONCORT ACADEMY · PROSTATE</text>
  <rect x="60" y="62" width="274" height="34" rx="17" fill="#DDF3F1"/>
  <text x="77" y="85" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83">CALENDRIER STÉRÉOTAXIQUE</text>
  <text x="60" y="132" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="60" dy="0">Ultra-hypofractionnement : sélectionner avant d&apos;accélérer</tspan></text>
  <g><g><rect x="70" y="235" width="370" height="355" rx="24" fill="#FFFCF4" stroke="#007C83" stroke-width="4"/><text x="255" y="278" font-family="Arial" font-size="18" font-weight="850" fill="#007C83" text-anchor="middle">Schéma le plus documenté</text><rect x="115" y="310" width="280" height="82" rx="18" fill="#007C83"/><text x="255" y="361" font-family="Arial" font-size="27" font-weight="900" fill="#FFFFFF" text-anchor="middle">36,25 Gy / 5 fx</text><text x="102" y="450" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="102" dy="0">Environ 2 semaines · prostate seule</tspan><tspan x="102" dy="22">· conditions stéréotaxiques · IGRT</tspan><tspan x="102" dy="22">et préparation robustes.</tspan></text></g><g><rect x="503" y="235" width="370" height="355" rx="24" fill="#FFFCF4" stroke="#2563A6" stroke-width="4"/><text x="688" y="278" font-family="Arial" font-size="18" font-weight="850" fill="#2563A6" text-anchor="middle">Autre schéma cité EAU</text><rect x="548" y="310" width="280" height="82" rx="18" fill="#2563A6"/><text x="688" y="361" font-family="Arial" font-size="27" font-weight="900" fill="#FFFFFF" text-anchor="middle">42,7 Gy / 7 fx</text><text x="535" y="450" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="535" dy="0">Pour certains risques intermédiaires</tspan><tspan x="535" dy="22">favorables ; rattacher au protocole</tspan><tspan x="535" dy="22">source exact.</tspan></text></g><g><rect x="936" y="235" width="370" height="355" rx="24" fill="#FFFCF4" stroke="#C85C4A" stroke-width="4"/><text x="1121" y="278" font-family="Arial" font-size="18" font-weight="850" fill="#C85C4A" text-anchor="middle">Ne pas extrapoler</text><rect x="981" y="310" width="280" height="82" rx="18" fill="#C85C4A"/><text x="1121" y="361" font-family="Arial" font-size="27" font-weight="900" fill="#FFFFFF" text-anchor="middle">Haut risque / pelvis</text><text x="968" y="450" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="968" dy="0">Reste en évaluation dans les</tspan><tspan x="968" dy="22">référentiels français cités ; ne</tspan><tspan x="968" dy="22">valide ni pelvis</tspan><tspan x="968" dy="22">ultra-hypofractionné ni omission de</tspan><tspan x="968" dy="22">l’ADT.</tspan></text></g><text x="688" y="635" font-family="Arial" font-size="15" font-weight="850" fill="#D97706" text-anchor="middle">Fonction urinaire, obstacle, OAR et workflow stéréotaxique précèdent le gain de temps.</text></g>
  <rect x="60" y="688" width="1256" height="48" rx="14" fill="#24313A"/>
  <text x="84" y="718" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#FFFFFF">Calendrier stéréotaxique · PÉDAGOGIQUE · NON À L’ÉCHELLE · SANS DONNÉE PATIENT</text>
  <text x="1290" y="718" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="650" fill="#BBD8D2" text-anchor="end">Sources et limites dans la leçon</text>
