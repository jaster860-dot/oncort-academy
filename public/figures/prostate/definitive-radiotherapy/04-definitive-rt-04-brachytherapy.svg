<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
<title id="title">Curiethérapie : monothérapie et boost sont deux intentions distinctes</title>
<desc id="desc">Comparaison entre curiethérapie LDR exclusive pour profils favorables et boost LDR ou HDR associé à la radiothérapie externe dans des risques plus élevés.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24313A"/></marker></defs>
