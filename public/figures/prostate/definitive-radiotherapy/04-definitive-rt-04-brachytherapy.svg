      <text x="90" y="350" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="90" dy="0">Risque tumoral</tspan></text>
      <line x1="90" y1="440" x2="304" y2="440" stroke="#007C83" stroke-width="2" stroke-dasharray="8 7"/>
      <text x="90" y="468" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#24313A" text-anchor="start"><tspan x="90" dy="0">La curiethérapie LDR à l&apos;iode</tspan><tspan x="90" dy="21">125 peut constituer un</tspan><tspan x="90" dy="21">traitement exclusif chez</tspan><tspan x="90" dy="21">certains faibles risques et</tspan><tspan x="90" dy="21">intermédiaires…</tspan></text>
    </g>
<path d="M 664 403 H 698" stroke="#24313A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><g>
      <rect x="386" y="238" width="270" height="330" rx="24" fill="#E5EEF8" stroke="#2563A6" stroke-width="4"/>
      <circle cx="428" cy="283" r="25" fill="#2563A6"/>
      <text x="428" y="291" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="428" dy="0">02</tspan></text>
      <text x="414" y="350" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="414" dy="0">Fonction urinaire et</tspan><tspan x="414" dy="32">anatomie</tspan></text>
      <line x1="414" y1="440" x2="628" y2="440" stroke="#2563A6" stroke-width="2" stroke-dasharray="8 7"/>
      <text x="414" y="468" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#24313A" text-anchor="start"><tspan x="414" dy="0">Un boost LDR ou HDR après</tspan><tspan x="414" dy="21">radiothérapie externe peut être</tspan><tspan x="414" dy="21">discuté dans l&apos;intermédiaire</tspan><tspan x="414" dy="21">défavorable ou le haut risque,</tspan><tspan x="414" dy="21">avec…</tspan></text>
    </g>
<path d="M 988 403 H 1022" stroke="#24313A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><g>
      <rect x="710" y="238" width="270" height="330" rx="24" fill="#FCE8C8" stroke="#D97706" stroke-width="4"/>
      <circle cx="752" cy="283" r="25" fill="#D97706"/>
      <text x="752" y="291" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="752" dy="0">03</tspan></text>
      <text x="738" y="350" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="738" dy="0">Monothérapie ou boost</tspan></text>
