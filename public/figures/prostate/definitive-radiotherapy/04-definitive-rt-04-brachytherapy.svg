<text x="58" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="1.8">ONCORT ACADEMY · PROSTATE</text>
<rect x="58" y="51" width="340" height="32" rx="16" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="76" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.7">COMPARAISON D’INTENTIONS</text>
<text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">Curiethérapie : monothérapie et boost sont deux intentions distinctes</text>
<rect x="58" y="152" width="602" height="386" rx="18" fill="#FFFFFF" stroke="#2563A6" stroke-width="3"/>
<text x="84" y="188" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#2563A6" text-anchor="start" letter-spacing="0">MONOTHÉRAPIE LDR · IODE 125</text>
<rect x="84" y="218" width="550" height="52" rx="13" fill="#E5EEF8" stroke="#2563A6" stroke-width="2"/>
<text x="359" y="251" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#2563A6" text-anchor="middle" letter-spacing="0">FAIBLE / INTERMÉDIAIRE FAVORABLE SÉLECTIONNÉ</text>
<text x="84" y="316" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="84" dy="0">Traitement exclusif</tspan><tspan x="84" dy="48">Fonction urinaire / volume</tspan><tspan x="84" dy="48">TURP / anatomie pubienne</tspan><tspan x="84" dy="48">Expertise du centre</tspan></text>
<rect x="692" y="152" width="602" height="386" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/>
<text x="718" y="188" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#D97706" text-anchor="start" letter-spacing="0">BOOST LDR OU HDR + RT EXTERNE</text>
<rect x="718" y="218" width="550" height="52" rx="13" fill="#FCE8C8" stroke="#D97706" stroke-width="2"/>
<text x="993" y="251" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#D97706" text-anchor="middle" letter-spacing="0">INTERMÉDIAIRE DÉFAVORABLE / HAUT RISQUE</text>
<text x="718" y="316" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="718" dy="0">Intensification locale</tspan><tspan x="718" dy="48">ADT adaptée au risque</tspan><tspan x="718" dy="48">Pas un simple fractionnement externe</tspan><tspan x="718" dy="48">Sélection urinaire stricte</tspan></text>
<rect x="58" y="568" width="1236" height="108" rx="15" fill="#F8DDD7" stroke="#C85C4A" stroke-width="2"/>
<text x="82" y="601" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#C85C4A" text-anchor="start" letter-spacing="0">BALANCE DU BOOST</text>
<text x="82" y="632" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#24313A" text-anchor="start"><tspan x="82" dy="0">Meilleur contrôle biochimique dans les essais de référence · pas de bénéfice de survie globale démontré</tspan><tspan x="82" dy="25">Toxicité génito-urinaire accrue · information et expérience de l’équipe déterminantes</tspan></text>
