      <text x="738" y="468" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#24313A" text-anchor="start"><tspan x="738" dy="0">Les essais de référence</tspan><tspan x="738" dy="21">soutiennent un meilleur</tspan><tspan x="738" dy="21">contrôle biochimique avec un</tspan><tspan x="738" dy="21">boost curiethérapique, sans</tspan><tspan x="738" dy="21">bénéfice…</tspan></text>
    </g>
