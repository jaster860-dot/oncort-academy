<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
<title id="title">Radiothérapie définitive : le risque fixe le socle, pas tous les détails</title>
<desc id="desc">Matrice des indications de radiothérapie externe par groupe de risque, distinguant surveillance active, ADT absente, courte ou longue, et décisions séparées sur pelvis, boost et volumes.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24313A"/></marker></defs>
<rect width="1376" height="768" fill="#FFF8E8"/>
<rect width="18" height="768" fill="#007C83"/>
<text x="58" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="1.8">ONCORT ACADEMY · PROSTATE</text>
<rect x="58" y="51" width="340" height="32" rx="16" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="76" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.7">MATRICE RISQUE–INTENTION</text>
<text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">Radiothérapie définitive : le risque fixe le socle, pas tous les détails</text>
<rect x="58" y="152" width="1236" height="368" rx="18" fill="#FFFFFF" stroke="#007C83" stroke-width="3"/>
<rect x="58" y="152" width="260" height="56" fill="#24313A"/>
<text x="76" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0.5">RISQUE</text>
<rect x="318" y="152" width="390" height="56" fill="#24313A"/>
<text x="336" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0.5">SOCLE</text>
<rect x="708" y="152" width="260" height="56" fill="#24313A"/>
<text x="726" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0.5">ADT</text>
<rect x="968" y="152" width="326" height="56" fill="#24313A"/>
<text x="986" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0.5">À DÉCIDER SÉPARÉMENT</text>
<rect x="59" y="208" width="1234" height="78" fill="#DDF3F1" opacity="0.75"/>
<text x="80" y="255" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Faible (SA si éligible)</text>
<text x="340" y="255" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">RT externe si traitement choisi</text>
<text x="730" y="255" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Sans ADT</text>
<text x="990" y="255" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Fonction / anatomie / préférence</text>
<rect x="59" y="286" width="1234" height="78" fill="#E5EEF8" opacity="0.75"/>
<text x="80" y="333" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Intermédiaire favorable</text>
<text x="340" y="333" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">RT externe curative</text>
<text x="730" y="333" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Généralement sans ADT</text>
<text x="990" y="333" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Fractionnement / faisabilité</text>
<rect x="59" y="364" width="1234" height="78" fill="#FCE8C8" opacity="0.75"/>
<text x="80" y="411" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Intermédiaire défavorable</text>
<text x="340" y="411" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">RT externe curative</text>
<text x="730" y="411" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Courte 4–6 mois</text>
<text x="990" y="411" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Pelvis et boost non automatiques</text>
<rect x="59" y="442" width="1234" height="78" fill="#F8DDD7" opacity="0.75"/>
<text x="80" y="489" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Haut risque / localement avancé</text>
<text x="340" y="489" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">RT prostatique haute dose ± extensions</text>
<text x="730" y="489" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">ADT longue</text>
<text x="990" y="489" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">VS / pelvis / boost / intensification</text>
<rect x="58" y="552" width="1236" height="124" rx="16" fill="#E5EEF8" stroke="#2563A6" stroke-width="2"/>
<text x="82" y="585" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#2563A6" text-anchor="start" letter-spacing="0">PRESCRIPTION À DÉCOMPOSER</text>
<text x="82" y="616" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="82" dy="0">Cible prostatique / vésicules · pelvis · boost focal ou curiethérapique · fractionnement · IGRT · ADT</tspan><tspan x="82" dy="27">Une étiquette de risque ne déclenche pas automatiquement toutes les composantes.</tspan></text>
<rect x="58" y="700" width="1260" height="42" rx="12" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="78" y="727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCES · RecoRad 2025 · CCAFU 2024–2026 · EAU 2026</text>
<text x="1298" y="727" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BBD8D2" text-anchor="end" letter-spacing="0">SYNTHÈSE ÉDUCATIVE · DONNÉES AGRÉGÉES</text>
</svg>
