<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">Volumes : prostate, vésicules et pelvis ne sont pas un paquet</title>
  <desc id="desc">Carte des volumes pour « Volumes : prostate, vésicules et pelvis ne sont pas un paquet ». Le schéma relie Extension locale ; Risque ganglionnaire ; Preuves et toxicités ; Volumes tracés sans représenter de données patient ni remplacer le protocole source.</desc>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6 z" fill="#24313A"/></marker></defs>
  <rect width="1376" height="768" fill="#FFF8E8"/>
  <rect width="18" height="768" fill="#007C83"/>
  <text x="60" y="46" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83" letter-spacing="2">ONCORT ACADEMY · PROSTATE</text>
  <rect x="60" y="62" width="204" height="34" rx="17" fill="#DDF3F1"/>
  <text x="77" y="85" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83">CARTE DES VOLUMES</text>
  <text x="60" y="132" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="60" dy="0">Volumes : prostate, vésicules et pelvis ne sont pas un paquet</tspan></text>
  <g><g><rect x="70" y="230" width="370" height="392" rx="22" fill="#FFFCF4" stroke="#007C83" stroke-width="3"/><text x="255" y="268" font-family="Arial" font-size="18" font-weight="850" fill="#007C83" text-anchor="middle">Faible / intermédiaire favorable</text><g><path d="M 177 385 Q 255 333 333 385 L 320 477 Q 255 513 190 477 Z" fill="#DDF3F1" stroke="#007C83" stroke-width="5"/></g><text x="98" y="552" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="98" dy="0">Prostate seule selon RecoRad ; ne pas</tspan><tspan x="98" dy="19">ajouter pelvis ou vésicules par</tspan><tspan x="98" dy="19">automatisme.</tspan></text></g><g><rect x="503" y="230" width="370" height="392" rx="22" fill="#FFFCF4" stroke="#D97706" stroke-width="3"/><text x="688" y="268" font-family="Arial" font-size="18" font-weight="850" fill="#D97706" text-anchor="middle">Intermédiaire défavorable / haut risque</text><g><ellipse cx="646" cy="349" rx="31" ry="18" fill="#FCE8C8" stroke="#D97706" stroke-width="4"/><ellipse cx="730" cy="349" rx="31" ry="18" fill="#FCE8C8" stroke="#D97706" stroke-width="4"/><path d="M 610 385 Q 688 333 766 385 L 753 477 Q 688 513 623 477 Z" fill="#DDF3F1" stroke="#007C83" stroke-width="5"/></g><text x="531" y="552" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="531" dy="0">Prostate + base des vésicules selon</tspan><tspan x="531" dy="19">risque ; vésicules complètes si T3b.</tspan></text></g><g><rect x="936" y="230" width="370" height="392" rx="22" fill="#FFFCF4" stroke="#2563A6" stroke-width="3"/><text x="1121" y="268" font-family="Arial" font-size="18" font-weight="850" fill="#2563A6" text-anchor="middle">Décision pelvienne séparée</text><g><path d="M 1016 280 Q 966 395 1016 510 M 1226 280 Q 1276 395 1226 510" fill="none" stroke="#2563A6" stroke-width="13" stroke-linecap="round"/><path d="M 1029 321 Q 979 395 1029 470 M 1213 321 Q 1263 395 1213 470" fill="none" stroke="#2563A6" stroke-width="5" stroke-dasharray="9 7"/><ellipse cx="1079" cy="349" rx="31" ry="18" fill="#FCE8C8" stroke="#D97706" stroke-width="4"/><ellipse cx="1163" cy="349" rx="31" ry="18" fill="#FCE8C8" stroke="#D97706" stroke-width="4"/><path d="M 1043 385 Q 1121 333 1199 385 L 1186 477 Q 1121 513 1056 477 Z" fill="#DDF3F1" stroke="#007C83" stroke-width="5"/></g><text x="964" y="552" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="964" dy="0">En cN0, documenter risque</tspan><tspan x="964" dy="19">ganglionnaire, stadification, preuve,</tspan><tspan x="964" dy="19">toxicité et règle du centre.</tspan></text></g><text x="688" y="660" font-family="Arial" font-size="14" font-weight="800" fill="#C85C4A" text-anchor="middle">Le TEP-PSMA négatif n’exclut pas le microscopique et ne rend pas le pelvis obligatoire.</text></g>
  <rect x="60" y="688" width="1256" height="48" rx="14" fill="#24313A"/>
