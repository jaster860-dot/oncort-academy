  <g><g><rect x="70" y="250" width="260" height="130" rx="20" fill="#E5EEF8" stroke="#2563A6" stroke-width="3"/><text x="200" y="288" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="850" fill="#2563A6" text-anchor="middle"><tspan x="200" dy="0">Question 1</tspan></text><text x="90" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="90" dy="0">Prédisposition</tspan><tspan x="90" dy="18">transmissible → test</tspan><tspan x="90" dy="18">germinal + conseil…</tspan></text></g><g><rect x="70" y="430" width="260" height="130" rx="20" fill="#DDF3F1" stroke="#007C83" stroke-width="3"/><text x="200" y="468" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="850" fill="#007C83" text-anchor="middle"><tspan x="200" dy="0">Question 2</tspan></text><text x="90" y="508" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="90" dy="0">Altération tumorale</tspan><tspan x="90" dy="18">actionnable → tissu</tspan><tspan x="90" dy="18">et/ou ADN tumoral…</tspan></text></g><path d="M 350 315 L 485 315" fill="none" stroke="#2563A6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 350 495 L 485 495" fill="none" stroke="#007C83" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g><rect x="505" y="340" width="360" height="130" rx="20" fill="#FCE8C8" stroke="#D97706" stroke-width="3"/><text x="685" y="378" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="850" fill="#D97706" text-anchor="middle"><tspan x="685" dy="0">Contrôle pré-analytique</tspan></text><text x="525" y="418" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="525" dy="0">Ancienneté/qualité du tissu ·</tspan><tspan x="525" dy="18">fraction tumorale · panel ·</tspan><tspan x="525" dy="18">traitement intermédiaire.</tspan></text></g><path d="M 885 405 L 1000 405" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g><rect x="1020" y="340" width="286" height="130" rx="20" fill="#F8DDD7" stroke="#C85C4A" stroke-width="3"/><text x="1163" y="378" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="850" fill="#C85C4A" text-anchor="middle"><tspan x="1163" dy="0">Interprétation</tspan></text><text x="1040" y="418" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="1040" dy="0">Actionnable · vrai négatif</tspan><tspan x="1040" dy="18">· ou non informatif → autre</tspan><tspan x="1040" dy="18">matrice/rebiopsie à…</tspan></text></g><text x="688" y="625" font-family="Arial" font-size="15" font-weight="850" fill="#C85C4A" text-anchor="middle">« Non informatif » n’est pas synonyme de « aucune altération ».</text></g>
