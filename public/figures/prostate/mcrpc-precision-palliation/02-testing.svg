<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">Oncologie de précision : tester assez tôt et au bon niveau</title>
  <desc id="desc">Parcours du test moléculaire pour « Oncologie de précision : tester assez tôt et au bon niveau ». Le schéma relie Question germinale/somatique ; Matrice et qualité ; Interprétation multidisciplinaire ; Traitement et implications familiales sans représenter de données patient ni remplacer le protocole source.</desc>
