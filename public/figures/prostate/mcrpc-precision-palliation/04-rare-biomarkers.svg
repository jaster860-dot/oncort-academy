<rect x="58" y="51" width="340" height="32" rx="16" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="76" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.7">MATRICE D’ACTIONNABILITÉ</text>
<text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">Biomarqueurs rares : validation, action et accès sont quatre questions</text>
<rect x="58" y="152" width="1236" height="416" rx="18" fill="#FFFFFF" stroke="#007C83" stroke-width="3"/>
<rect x="58" y="152" width="260" height="56" fill="#24313A"/>
<text x="76" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0.6">MARQUEUR</text>
<rect x="318" y="152" width="280" height="56" fill="#24313A"/>
<text x="336" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0.6">VALIDATION</text>
<rect x="598" y="152" width="358" height="56" fill="#24313A"/>
<text x="616" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0.6">PORTÉE CLINIQUE</text>
<rect x="956" y="152" width="338" height="56" fill="#24313A"/>
<text x="974" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0.6">ACCÈS</text>
<rect x="59" y="208" width="1234" height="90" fill="#DDF3F1" opacity="0.72"/>
<text x="80" y="261" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">MSI-H / dMMR</text>
<text x="340" y="261" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Compte rendu moléculaire validé</text>
<text x="620" y="261" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Option d’immunothérapie possible selon ligne</text>
<text x="978" y="261" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">AMM / remboursement / RCP</text>
<rect x="59" y="298" width="1234" height="90" fill="#E5EEF8" opacity="0.72"/>
<text x="80" y="351" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">TMB élevé</text>
<text x="340" y="351" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Méthode + seuil + qualité</text>
<text x="620" y="351" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Valeur contextuelle, non automatique</text>
<text x="978" y="351" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Juridiction / essai clinique</text>
<rect x="59" y="388" width="1234" height="90" fill="#FCE8C8" opacity="0.72"/>
<text x="80" y="441" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">CDK12</text>
<text x="340" y="441" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Altération interprétée</text>
<text x="620" y="441" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Exploratoire / hypothèse biologique</text>
<text x="978" y="441" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">RCP moléculaire / essai</text>
<rect x="59" y="478" width="1234" height="90" fill="#F8DDD7" opacity="0.72"/>
<text x="80" y="531" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Autres marqueurs</text>
<text x="340" y="531" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Ne pas surinterpréter un signal</text>
<text x="620" y="531" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Pas d’indication standard par défaut</text>
<text x="978" y="531" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Accès séparé de plausibilité</text>
<rect x="58" y="594" width="1236" height="82" rx="15" fill="#F8DDD7" stroke="#C85C4A" stroke-width="2"/>
<text x="82" y="624" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#24313A" text-anchor="start"><tspan x="82" dy="0">RARE ≠ CERTAIN · BIOLOGIQUEMENT PLAUSIBLE ≠ ACTIONNABLE · ACTIONNABLE ≠ ACCESSIBLE</tspan><tspan x="82" dy="25">Tracer test, méthode, interprétation, niveau de preuve, ligne, AMM, remboursement et alternative d’essai.</tspan></text>
<rect x="58" y="700" width="1260" height="42" rx="12" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="78" y="727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCES · EAU 2026 · ESMO 2026 · ASCO Genomic Testing 2025</text>
<text x="1298" y="727" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BBD8D2" text-anchor="end" letter-spacing="0">SYNTHÈSE ÉDUCATIVE · DONNÉES AGRÉGÉES</text>
</svg>
