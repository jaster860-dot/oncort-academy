<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">HRR/BRCA et PARP : lire le gène, la ligne et le partenaire</title>
  <desc id="desc">Voie HRR–PARP pour « HRR/BRCA et PARP : lire le gène, la ligne et le partenaire ». Le schéma relie Altération HRR qualifiée ; Indication réglementaire ; Expositions antérieures ; PARP et surveillance sans représenter de données patient ni remplacer le protocole source.</desc>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6 z" fill="#24313A"/></marker></defs>
  <rect width="1376" height="768" fill="#FFF8E8"/>
  <rect width="18" height="768" fill="#007C83"/>
  <text x="60" y="46" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83" letter-spacing="2">ONCORT ACADEMY · PROSTATE</text>
  <rect x="60" y="62" width="190" height="34" rx="17" fill="#DDF3F1"/>
  <text x="77" y="85" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83">VOIE HRR–PARP</text>
  <text x="60" y="132" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="60" dy="0">HRR/BRCA et PARP : lire le gène, la ligne et le partenaire</tspan></text>
  <g><g><rect x="70" y="330" width="270" height="130" rx="20" fill="#E5EEF8" stroke="#2563A6" stroke-width="3"/><text x="205" y="368" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="850" fill="#2563A6" text-anchor="middle"><tspan x="205" dy="0">Altération HRR</tspan></text><text x="90" y="408" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="90" dy="0">Nommer le gène, la</tspan><tspan x="90" dy="18">méthode et, si connu, le</tspan><tspan x="90" dy="18">statut mono-/biallélique.</tspan></text></g><path d="M 360 395 L 480 395" fill="none" stroke="#2563A6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g><rect x="500" y="245" width="340" height="130" rx="20" fill="#DDF3F1" stroke="#007C83" stroke-width="3"/><text x="670" y="283" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="850" fill="#007C83" text-anchor="middle"><tspan x="670" dy="0">Signal le plus robuste</tspan></text><text x="520" y="323" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="520" dy="0">BRCA1/2, particulièrement BRCA2</tspan><tspan x="520" dy="18">: preuve généralement plus</tspan><tspan x="520" dy="18">solide.</tspan></text></g><g><rect x="500" y="445" width="340" height="130" rx="20" fill="#FCE8C8" stroke="#D97706" stroke-width="3"/><text x="670" y="483" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="850" fill="#D97706" text-anchor="middle"><tspan x="670" dy="0">Autres gènes HRR</tspan></text><text x="520" y="523" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="520" dy="0">Amplitude du bénéfice plus</tspan><tspan x="520" dy="18">incertaine : ne pas homogénéiser</tspan><tspan x="520" dy="18">« HRR+ ».</tspan></text></g><path d="M 860 310 L 980 375" fill="none" stroke="#007C83" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 860 510 L 980 430" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g><rect x="1000" y="330" width="306" height="130" rx="20" fill="#F8DDD7" stroke="#C85C4A" stroke-width="3"/><text x="1153" y="368" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="850" fill="#C85C4A" text-anchor="middle"><tspan x="1153" dy="0">Décision précise</tspan></text><text x="1020" y="408" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="1020" dy="0">Molécule · mono/combinaison ·</tspan><tspan x="1020" dy="18">ligne · exposition ARPI ·</tspan><tspan x="1020" dy="18">toxicité hématologique.</tspan></text></g><text x="688" y="625" font-family="Arial" font-size="15" font-weight="850" fill="#24313A" text-anchor="middle">Biomarqueur × séquence × molécule × réserves médullaires : les quatre doivent concordent.</text></g>
  <rect x="60" y="688" width="1256" height="48" rx="14" fill="#24313A"/>
  <text x="84" y="718" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#FFFFFF">Voie HRR–PARP · PÉDAGOGIQUE · NON À L’ÉCHELLE · SANS DONNÉE PATIENT</text>
  <text x="1290" y="718" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="650" fill="#BBD8D2" text-anchor="end">Sources et limites dans la leçon</text>
  </svg>
