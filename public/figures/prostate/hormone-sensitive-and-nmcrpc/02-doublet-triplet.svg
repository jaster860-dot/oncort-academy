<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
<title id="title">mHSPC : choisir l’intensification sans hiérarchie artificielle</title>
<desc id="desc">Algorithme de première ligne mHSPC distinguant le socle ADT, le doublet ADT plus ARPI et le triplet chez un patient apte au docétaxel.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24313A"/></marker></defs>
<rect width="1376" height="768" fill="#FFF8E8"/>
<rect width="18" height="768" fill="#007C83"/>
<text x="58" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="1.8">ONCORT ACADEMY · PROSTATE</text>
<rect x="58" y="51" width="340" height="32" rx="16" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="76" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.7">ALGORITHME DOUBLET / TRIPLET</text>
<text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">mHSPC : choisir l’intensification sans hiérarchie artificielle</text>
<rect x="58" y="149" width="1260" height="92" rx="18" fill="#DDF3F1" stroke="#007C83" stroke-width="3"/>
<text x="86" y="181" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#007C83" text-anchor="start" letter-spacing="0.8">DÉCRIRE AVANT DE CHOISIR</text>
<text x="86" y="215" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Charge selon l’essai</text>
<text x="362" y="215" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">De novo ↔ métachrone</text>
<text x="690" y="215" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Symptômes / cinétique</text>
<text x="1007" y="215" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Fitness / comorbidités</text>
<path d="M688 242 L688 278" stroke="#24313A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="498" y="278" width="380" height="66" rx="16" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="688" y="319" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="850" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">SOCLE : ADT</text>
<path d="M688 344 L688 376 L380 376 L380 403" stroke="#24313A" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M688 376 L996 376 L996 403" stroke="#24313A" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="58" y="402" width="606" height="214" rx="18" fill="#E5EEF8" stroke="#2563A6" stroke-width="3"/>
<text x="86" y="437" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="850" fill="#2563A6" text-anchor="start" letter-spacing="0">DOUBLET · ADT + ARPI</text>
<text x="636" y="437" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#2563A6" text-anchor="end" letter-spacing="0.5">LARGE POPULATION</text>
<text x="86" y="478" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24313A" text-anchor="start"><tspan x="86" dy="0">• Référence moderne pour de nombreux patients</tspan><tspan x="86" dy="30">• Agent choisi selon terrain, interactions et exposition</tspan><tspan x="86" dy="30">• Pas de classement direct simple entre ARPI</tspan></text>
<rect x="712" y="402" width="606" height="214" rx="18" fill="#FCE8C8" stroke="#D97706" stroke-width="3"/>
<text x="740" y="437" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="850" fill="#D97706" text-anchor="start" letter-spacing="0">TRIPLET · ADT + DOCÉTAXEL + ARPI</text>
<text x="1290" y="437" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#D97706" text-anchor="end" letter-spacing="0.5">SÉLECTION</text>
<text x="740" y="478" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24313A" text-anchor="start"><tspan x="740" dy="0">• Patient apte au docétaxel</tspan><tspan x="740" dy="30">• Preuve surtout de novo, souvent forte charge</tspan><tspan x="740" dy="30">• Toxicités et logistique chimiothérapie acceptables</tspan></text>
<rect x="58" y="636" width="1260" height="42" rx="12" fill="#F8DDD7" stroke="#C85C4A" stroke-width="2"/>
<text x="78" y="662" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#C85C4A" text-anchor="start" letter-spacing="0">LIMITE DE PREUVE</text>
<text x="242" y="662" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Le triplet a été comparé à ADT–docétaxel, pas à chaque doublet ADT–ARPI dans tous les sous-groupes.</text>
<rect x="58" y="700" width="1260" height="42" rx="12" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="78" y="727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCES · CCAFU 2024–2026 · EAU 2026 · ESMO 2026</text>
<text x="1298" y="727" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BBD8D2" text-anchor="end" letter-spacing="0">SYNTHÈSE ÉDUCATIVE · DONNÉES AGRÉGÉES</text>
</svg>
