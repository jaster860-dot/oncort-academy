<rect x="82" y="304" width="334" height="52" rx="12" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="100" y="336" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">catégorie moléculaire plus avancée</text>
