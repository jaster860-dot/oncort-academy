<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
<title id="title">PSMA-PET : meilleure détection, nouvelles incertitudes</title>
<desc id="desc">Trois panneaux expliquent migration de stade, faux négatif à faible volume ou faible expression, et faux positif ou fixation non spécifique.</desc>
