<text x="925" y="486" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#C85C4A" text-anchor="start"><tspan x="925" dy="0">Corrélat morphologique et confirmation si enjeu majeur</tspan></text>
<rect x="58" y="620" width="1236" height="56" rx="13" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="676" y="655" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Interpréter localisation + intensité + morphologie + risque prétest + conséquence de la décision.</text>
