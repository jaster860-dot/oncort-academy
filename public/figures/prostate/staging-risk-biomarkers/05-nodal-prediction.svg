  <rect width="18" height="768" fill="#007C83"/>
  <text x="60" y="46" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83" letter-spacing="2">ONCORT ACADEMY · PROSTATE</text>
  <rect x="60" y="62" width="374" height="34" rx="17" fill="#DDF3F1"/>
  <text x="77" y="85" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83">JAUGE DE PROBABILITÉ GANGLIONNAIRE</text>
  <text x="60" y="132" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="60" dy="0">Risque ganglionnaire : documenter une probabilité sans</tspan><tspan x="60" dy="39">inventer un stade</tspan></text>
  <g><rect x="70" y="250" width="300" height="300" rx="24" fill="#E5EEF8" stroke="#2563A6" stroke-width="3"/><text x="220" y="289" font-family="Arial" font-size="19" font-weight="850" fill="#2563A6" text-anchor="middle">ENTRÉES</text><text x="115" y="335" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#24313A" text-anchor="start"><tspan x="115" dy="0">PSA</tspan><tspan x="115" dy="38">cT</tspan><tspan x="115" dy="38">groupe ISUP</tspan><tspan x="115" dy="38">charge biopsique</tspan><tspan x="115" dy="38">± variables IRM</tspan></text><path d="M 390 400 L 520 400" fill="none" stroke="#007C83" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="540" y="285" width="296" height="230" rx="24" fill="#DDF3F1" stroke="#007C83" stroke-width="4"/><text x="688" y="333" font-family="Arial" font-size="19" font-weight="850" fill="#007C83" text-anchor="middle">NOMOGRAMME IDENTIFIÉ</text><text x="688" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24313A" text-anchor="middle"><tspan x="688" dy="0">modèle + version</tspan><tspan x="688" dy="34">population de validation</tspan><tspan x="688" dy="34">données saisies</tspan><tspan x="688" dy="34">seuil lié à la question</tspan></text><path d="M 856 400 L 986 400" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1006" y="250" width="300" height="300" rx="24" fill="#FCE8C8" stroke="#D97706" stroke-width="3"/><text x="1156" y="289" font-family="Arial" font-size="19" font-weight="850" fill="#D97706" text-anchor="middle">SORTIE</text><text x="1156" y="338" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" fill="#24313A" text-anchor="middle"><tspan x="1156" dy="0">Probabilité prétest</tspan><tspan x="1156" dy="38">≠ ganglion visible</tspan><tspan x="1156" dy="38">≠ cN / pN</tspan><tspan x="1156" dy="38">≠ indication automatique</tspan><tspan x="1156" dy="38">de pelvis ou systémique</tspan></text><rect x="245" y="585" width="886" height="58" rx="18" fill="#F8DDD7" stroke="#C85C4A" stroke-width="3"/><text x="688" y="620" font-family="Arial" font-size="17" font-weight="850" fill="#C85C4A" text-anchor="middle">Une imagerie négative ne ramène pas le risque à zéro ; la pathologie reste une information différente.</text></g>
