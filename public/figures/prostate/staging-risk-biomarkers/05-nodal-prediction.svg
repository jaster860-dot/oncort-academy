<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">Risque ganglionnaire : documenter une probabilité sans inventer un stade</title>
  <desc id="desc">Jauge de probabilité ganglionnaire pour « Risque ganglionnaire : documenter une probabilité sans inventer un stade ». Le schéma relie Variables sources vérifiées ; Nomogramme nommé et versionné ; Probabilité avec limites ; Décision contextualisée sans faux stade sans représenter de données patient ni remplacer le protocole source.</desc>
