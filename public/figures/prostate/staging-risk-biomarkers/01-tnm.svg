<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">TNM : décrire l&apos;extension sans mélanger les instruments</title>
  <desc id="desc">Carte TNM pour « TNM : décrire l&apos;extension sans mélanger les instruments ». Le schéma relie Examen clinique ; Imagerie nommée ; cTNM explicite ; Décision sans faux mélange sans représenter de données patient ni remplacer le protocole source.</desc>
