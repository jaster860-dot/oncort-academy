dy="24">d’imagerie et niveau de certitude</tspan><tspan x="946" dy="24">explicités</tspan></text><text x="688" y="659" font-family="Arial" font-size="14" font-weight="850" fill="#C85C4A" text-anchor="middle">TNM = étendue anatomique ; il ne résume ni ISUP, ni risque de rechute, ni aptitude du patient.</text></g>
