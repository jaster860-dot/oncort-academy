<text x="82" y="599" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="82" dy="0">Maladie agressive ou métastatique jeune · agrégation familiale précoce · histoire sein–ovaire / Lynch</tspan><tspan x="82" dy="27">BRCA1/2 somatique · test sans conséquence anticipée = ambiguïté, pas médecine de précision</tspan></text>
