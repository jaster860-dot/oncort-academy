<text x="718" y="312" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="718" dy="0">Question : option thérapeutique</tspan><tspan x="718" dy="42">Panel / échantillon / ligne</tspan><tspan x="718" dy="42">Altération parfois germinale</tspan><tspan x="718" dy="42">→ confirmation dédiée si signal</tspan></text>
