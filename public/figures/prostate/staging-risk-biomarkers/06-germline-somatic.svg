<text x="84" y="312" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="84" dy="0">Question : risque héréditaire</tspan><tspan x="84" dy="42">Conséquence : patient + famille</tspan><tspan x="84" dy="42">Information / consentement / conseil</tspan><tspan x="84" dy="42">Cascade familiale possible</tspan></text>
