<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
<title id="title">Groupes de risque EAU : conserver les variables sources</title>
<desc id="desc">Tableau de la grille EAU distinguant faible risque, intermédiaire favorable et défavorable, haut risque localisé et localement avancé selon PSA, cT et ISUP.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24313A"/></marker></defs>
<rect width="1376" height="768" fill="#FFF8E8"/>
<rect width="18" height="768" fill="#007C83"/>
<text x="58" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="1.8">ONCORT ACADEMY · PROSTATE</text>
<rect x="58" y="51" width="340" height="32" rx="16" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="76" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.7">GRILLE PSA–CT–ISUP</text>
<text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">Groupes de risque EAU : conserver les variables sources</text>
<rect x="58" y="152" width="1236" height="408" rx="18" fill="#FFFFFF" stroke="#007C83" stroke-width="3"/>
<rect x="58" y="152" width="288" height="56" fill="#24313A"/>
<text x="76" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0">CATÉGORIE</text>
<rect x="346" y="152" width="220" height="56" fill="#24313A"/>
<text x="364" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0">ISUP</text>
<rect x="566" y="152" width="270" height="56" fill="#24313A"/>
<text x="584" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0">PSA</text>
<rect x="836" y="152" width="458" height="56" fill="#24313A"/>
<text x="854" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0">cT / cN</text>
<rect x="59" y="208" width="1234" height="70" fill="#DDF3F1" opacity="0.76"/>
<text x="80" y="251" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Faible</text>
<text x="368" y="251" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">1</text>
<text x="588" y="251" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">&lt; 10 ng/mL</text>
<text x="858" y="251" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">cT1–2</text>
<rect x="59" y="278" width="1234" height="70" fill="#E5EEF8" opacity="0.76"/>
<text x="80" y="321" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Intermédiaire favorable</text>
<text x="368" y="321" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">2 avec PSA &lt;10, ou ISUP 1</text>
<text x="588" y="321" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">10–20 si ISUP 1</text>
<text x="858" y="321" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">cT1–2</text>
<rect x="59" y="348" width="1234" height="70" fill="#FCE8C8" opacity="0.76"/>
<text x="80" y="391" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Intermédiaire défavorable</text>
<text x="368" y="391" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">2 avec PSA 10–20, ou ISUP 3</text>
<text x="588" y="391" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">&lt; 20 selon combinaison</text>
<text x="858" y="391" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">cT1–2</text>
<rect x="59" y="418" width="1234" height="70" fill="#F8DDD7" opacity="0.76"/>
<text x="80" y="461" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Haut risque localisé</text>
<text x="368" y="461" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">4–5</text>
<text x="588" y="461" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">ou &gt; 20 ng/mL</text>
<text x="858" y="461" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">cT1–2</text>
<rect x="59" y="488" width="1234" height="70" fill="#F2ECFA" opacity="0.76"/>
<text x="80" y="531" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Localement avancé</text>
<text x="368" y="531" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">tout ISUP</text>
<text x="588" y="531" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">tout PSA</text>
<text x="858" y="531" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">cT3–4 ou cN+</text>
<rect x="58" y="590" width="1236" height="86" rx="15" fill="#F8DDD7" stroke="#C85C4A" stroke-width="2"/>
<text x="82" y="620" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#24313A" text-anchor="start"><tspan x="82" dy="0">Toujours nommer référentiel + version + PSA + cT + ISUP.</tspan><tspan x="82" dy="25">EAU et D’Amico ne découpent pas exactement les mêmes catégories ; « intermédiaire » seul n’est pas transmissible.</tspan></text>
<rect x="58" y="700" width="1260" height="42" rx="12" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="78" y="727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCE DE LA GRILLE · EAU 2026 · comparaison CCAFU/D’Amico dans la leçon</text>
<text x="1298" y="727" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BBD8D2" text-anchor="end" letter-spacing="0">SYNTHÈSE ÉDUCATIVE · DONNÉES AGRÉGÉES</text>
</svg>
