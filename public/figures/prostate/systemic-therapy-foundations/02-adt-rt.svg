<rect x="58" y="51" width="340" height="32" rx="16" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="76" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.7">MATRICE CONTEXTUELLE</text>
<text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">ADT + radiothérapie : l’indication et la durée dépendent du contexte</text>
<rect x="58" y="152" width="1236" height="368" rx="18" fill="#FFFFFF" stroke="#007C83" stroke-width="3"/>
<rect x="58" y="152" width="270" height="56" fill="#24313A"/>
<text x="78" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0.7">CONTEXTE</text>
<rect x="328" y="152" width="420" height="56" fill="#24313A"/>
<text x="348" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0.7">QUESTION À TRANCHER</text>
<rect x="748" y="152" width="546" height="56" fill="#24313A"/>
<text x="768" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0.7">À TRACER</text>
<rect x="59" y="208" width="1234" height="78" fill="#E5EEF8" opacity="0.72"/>
<text x="80" y="255" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Intermédiaire</text>
<text x="350" y="255" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Sous-groupe et bénéfice attendu</text>
<text x="770" y="255" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Début, durée, vulnérabilités</text>
<rect x="59" y="286" width="1234" height="78" fill="#DDF3F1" opacity="0.72"/>
<text x="80" y="333" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Haut risque</text>
<text x="350" y="333" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">ADT longue + cohérence des volumes</text>
<text x="770" y="333" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Objectif de durée et adaptation</text>
<rect x="59" y="364" width="1234" height="78" fill="#FCE8C8" opacity="0.72"/>
<text x="80" y="411" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">cN1</text>
<text x="350" y="411" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Locorégional + risque systémique</text>
<text x="770" y="411" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Pelvis, intensification, prévention</text>
<rect x="59" y="442" width="1234" height="78" fill="#F8DDD7" opacity="0.72"/>
<text x="80" y="489" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Rattrapage postop.</text>
<text x="350" y="489" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">PSA, facteurs et moment du salvage</text>
<text x="770" y="489" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Pourquoi ajouter l’ADT, combien de temps</text>
<rect x="58" y="548" width="1236" height="128" rx="16" fill="#E5EEF8" stroke="#2563A6" stroke-width="2"/>
<text x="82" y="581" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#2563A6" text-anchor="start" letter-spacing="0.7">PRESCRIPTION COMPLÈTE</text>
<text x="82" y="611" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="82" dy="0">Indication · molécule · début relatif à la RT · durée cible · prévention · critères de réévaluation</tspan><tspan x="82" dy="25">Une réduction pour vulnérabilité est une adaptation tracée, pas une nouvelle équivalence de preuve.</tspan></text>
<rect x="58" y="700" width="1260" height="42" rx="12" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="78" y="727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCES · ESTRO-ACROP 2023 · EAU 2026 · CCAFU 2024–2026</text>
<text x="1298" y="727" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BBD8D2" text-anchor="end" letter-spacing="0">SYNTHÈSE ÉDUCATIVE · DONNÉES AGRÉGÉES</text>
