<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
<title id="title">Prévention sous traitement systémique : ne pas confondre deux risques osseux</title>
<desc id="desc">Deux colonnes distinguent fracture de fragilité liée à l’ADT et événements squelettiques du mCRPC osseux, puis listent le bilan initial et une urgence neurologique.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24313A"/></marker></defs>
<rect width="1376" height="768" fill="#FFF8E8"/>
<rect width="18" height="768" fill="#007C83"/>
<text x="58" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="1.8">ONCORT ACADEMY · PROSTATE</text>
<rect x="58" y="51" width="340" height="32" rx="16" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="76" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.7">COMPARAISON + CHECKLIST INITIALE</text>
<text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">Prévention sous traitement systémique : ne pas confondre deux risques osseux</text>
<rect x="58" y="152" width="602" height="286" rx="18" fill="#FFFFFF" stroke="#2563A6" stroke-width="3"/>
<text x="84" y="188" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="850" fill="#2563A6" text-anchor="start" letter-spacing="0">OS FRAGILE SOUS ADT</text>
<text x="84" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#2563A6" text-anchor="start" letter-spacing="0">OBJECTIF · prévenir la fracture de fragilité</text>
<text x="84" y="263" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="84" dy="0">Risque de chute / antécédents</tspan><tspan x="84" dy="38">DMO selon contexte</tspan><tspan x="84" dy="38">Exercice résistance + endurance</tspan><tspan x="84" dy="38">Traitement anti-ostéoporotique si indiqué</tspan></text>
<rect x="692" y="152" width="602" height="286" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/>
<text x="718" y="188" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="850" fill="#D97706" text-anchor="start" letter-spacing="0">mCRPC OSSEUX</text>
<text x="718" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#D97706" text-anchor="start" letter-spacing="0">OBJECTIF · prévenir les événements squelettiques</text>
<text x="718" y="263" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="718" dy="0">Indication oncologique distincte</tspan><tspan x="718" dy="38">Dose / rythme non interchangeables</tspan><tspan x="718" dy="38">Dentaire · Ca · vitamine D · rein</tspan><tspan x="718" dy="38">Surveillance propre à l’agent</tspan></text>
<rect x="58" y="466" width="1236" height="132" rx="16" fill="#DDF3F1" stroke="#007C83" stroke-width="2"/>
<text x="82" y="499" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#007C83" text-anchor="start" letter-spacing="0.7">BILAN DÈS LE DÉPART</text>
<text x="82" y="530" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="82" dy="0">Poids · TA · tabac · activité · antécédents CV · glycémie/HbA1c · lipides</tspan><tspan x="82" dy="27">Chutes · nutrition · santé sexuelle · coordination médecin traitant / cardiologie / oncogériatrie</tspan></text>
<rect x="58" y="622" width="1236" height="54" rx="13" fill="#F8DDD7" stroke="#C85C4A" stroke-width="2"/>
<text x="82" y="655" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#C85C4A" text-anchor="start" letter-spacing="0">URGENCE</text>
<text x="174" y="655" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Douleur rachidienne + déficit neurologique ou trouble sphinctérien → évaluation immédiate</text>
<rect x="58" y="700" width="1260" height="42" rx="12" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="78" y="727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCES · CCAFU 2024–2026 · EAU 2026 · ESMO 2026</text>
<text x="1298" y="727" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BBD8D2" text-anchor="end" letter-spacing="0">SYNTHÈSE ÉDUCATIVE · DONNÉES AGRÉGÉES</text>
</svg>
