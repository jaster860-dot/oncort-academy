<text x="892" y="466" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="850" fill="#C85C4A" text-anchor="start"><tspan x="892" dy="0">Résistance à la castration</tspan><tspan x="892" dy="27">= progression malgré niveau</tspan><tspan x="892" dy="27">de testostérone de castration</tspan></text>
