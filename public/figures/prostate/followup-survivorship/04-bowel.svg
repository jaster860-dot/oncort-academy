<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">Toxicité digestive : quantifier, explorer, coordonner</title>
  <desc id="desc">Carte digestive pour « Toxicité digestive : quantifier, explorer, coordonner ». Le schéma relie Symptôme digestif ; Gravité et causes ; Avis spécialisé ; Traitement gradué sans représenter de données patient ni remplacer le protocole source.</desc>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6 z" fill="#24313A"/></marker></defs>
  <rect width="1376" height="768" fill="#FFF8E8"/>
  <rect width="18" height="768" fill="#007C83"/>
  <text x="60" y="46" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83" letter-spacing="2">ONCORT ACADEMY · PROSTATE</text>
  <rect x="60" y="62" width="190" height="34" rx="17" fill="#DDF3F1"/>
  <text x="77" y="85" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83">CARTE DIGESTIVE</text>
  <text x="60" y="132" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="60" dy="0">Toxicité digestive : quantifier, explorer, coordonner</tspan></text>
  <g><rect x="70" y="220" width="520" height="410" rx="24" fill="#FFFCF4" stroke="#C85C4A" stroke-width="3"/><path d="M 290 270 Q 390 260 420 330 L 410 480 Q 400 555 330 590 Q 260 555 250 480 L 240 330 Q 260 280 290 270" fill="#F8DDD7" stroke="#C85C4A" stroke-width="6"/><line x1="330" y1="325" x2="330" y2="565" stroke="#FFFCF4" stroke-width="18"/><text x="330" y="610" font-family="Arial" font-size="16" font-weight="850" fill="#C85C4A" text-anchor="middle">Rectum → canal anal</text><g><rect x="630" y="220" width="676" height="112" rx="16" fill="#F8DDD7" stroke="#C85C4A" stroke-width="3"/>
    <text x="648" y="251" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#C85C4A" text-anchor="start"><tspan x="648" dy="0">Phénotype</tspan></text>
    <text x="648" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="648" dy="0">Urgence, fréquence, mucus, douleur, incontinence, ténesme ou</tspan><tspan x="648" dy="18">saignement ; préciser chronologie et grade.</tspan></text></g><g><rect x="630" y="352" width="676" height="112" rx="16" fill="#FCE8C8" stroke="#D97706" stroke-width="3"/>
    <text x="648" y="383" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#D97706" text-anchor="start"><tspan x="648" dy="0">Chercher une cause</tspan></text>
    <text x="648" y="414" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="648" dy="0">Infection, MICI, médicament, hémorroïdes, néoplasie ou autre</tspan><tspan x="648" dy="18">cause digestive restent possibles.</tspan></text></g><g><rect x="630" y="484" width="676" height="112" rx="16" fill="#E5EEF8" stroke="#2563A6" stroke-width="3"/>
    <text x="648" y="515" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#2563A6" text-anchor="start"><tspan x="648" dy="0">Signal d’alarme</tspan></text>
    <text x="648" y="546" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="648" dy="0">Saignement important, anémie, douleur, amaigrissement ou</tspan><tspan x="648" dy="18">modification persistante → exploration adaptée, pas diagnostic</tspan><tspan x="648" dy="18">par défaut.</tspan></text></g></g>
  <rect x="60" y="688" width="1256" height="48" rx="14" fill="#24313A"/>
  <text x="84" y="718" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#FFFFFF">Carte digestive · PÉDAGOGIQUE · NON À L’ÉCHELLE · SANS DONNÉE PATIENT</text>
  <text x="1290" y="718" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="650" fill="#BBD8D2" text-anchor="end">Sources et limites dans la leçon</text>
