<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">Toxicité urinaire : caractériser avant de traiter</title>
  <desc id="desc">Carte urinaire pour « Toxicité urinaire : caractériser avant de traiter ». Le schéma relie Symptôme et délai ; Mécanisme probable ; Examens ciblés ; Rééducation, médicament ou geste sans représenter de données patient ni remplacer le protocole source.</desc>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6 z" fill="#24313A"/></marker></defs>
  <rect width="1376" height="768" fill="#FFF8E8"/>
  <rect width="18" height="768" fill="#007C83"/>
  <text x="60" y="46" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83" letter-spacing="2">ONCORT ACADEMY · PROSTATE</text>
  <rect x="60" y="62" width="190" height="34" rx="17" fill="#DDF3F1"/>
  <text x="77" y="85" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#007C83">CARTE URINAIRE</text>
  <text x="60" y="132" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="60" dy="0">Toxicité urinaire : caractériser avant de traiter</tspan></text>
  <g><rect x="70" y="220" width="520" height="410" rx="24" fill="#FFFCF4" stroke="#2563A6" stroke-width="3"/><ellipse cx="330" cy="325" rx="110" ry="72" fill="#E5EEF8" stroke="#2563A6" stroke-width="5"/><text x="330" y="332" font-family="Arial" font-size="18" font-weight="850" fill="#24313A" text-anchor="middle">Vessie</text><line x1="330" y1="397" x2="330" y2="555" stroke="#D97706" stroke-width="10"/><ellipse cx="330" cy="430" rx="45" ry="25" fill="#DDF3F1" stroke="#007C83" stroke-width="4"/><text x="347" y="520" font-family="Arial" font-size="15" font-weight="800" fill="#D97706">Urètre</text><g><rect x="630" y="220" width="676" height="112" rx="16" fill="#E5EEF8" stroke="#2563A6" stroke-width="3"/>
    <text x="648" y="251" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#2563A6" text-anchor="start"><tspan x="648" dy="0">Symptôme</tspan></text>
    <text x="648" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="648" dy="0">Irritatif, obstructif, incontinence, douleur ou hématurie ;</tspan><tspan x="648" dy="18">grade, temporalité et retentissement.</tspan></text></g><g><rect x="630" y="352" width="676" height="112" rx="16" fill="#FCE8C8" stroke="#D97706" stroke-width="3"/>
    <text x="648" y="383" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#D97706" text-anchor="start"><tspan x="648" dy="0">Mécanisme possible</tspan></text>
    <text x="648" y="414" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="648" dy="0">Inflammation, sténose, obstruction, infection, dysfonction</tspan><tspan x="648" dy="18">vésicale ou séquelle sphinctérienne : ne pas tout attribuer à la</tspan><tspan x="648" dy="18">RT.</tspan></text></g><g><rect x="630" y="484" width="676" height="112" rx="16" fill="#F8DDD7" stroke="#C85C4A" stroke-width="3"/>
    <text x="648" y="515" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#C85C4A" text-anchor="start"><tspan x="648" dy="0">Évaluer puis agir</tspan></text>
    <text x="648" y="546" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#24313A" text-anchor="start"><tspan x="648" dy="0">ECBU, débit/résidu, endoscopie ou imagerie selon le signal ;</tspan><tspan x="648" dy="18">hématurie macroscopique/rétention = évaluation rapide.</tspan></text></g></g>
  <rect x="60" y="688" width="1256" height="48" rx="14" fill="#24313A"/>
  <text x="84" y="718" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#FFFFFF">Carte urinaire · PÉDAGOGIQUE · NON À L’ÉCHELLE · SANS DONNÉE PATIENT</text>
  <text x="1290" y="718" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="650" fill="#BBD8D2" text-anchor="end">Sources et limites dans la leçon</text>
  </svg>
