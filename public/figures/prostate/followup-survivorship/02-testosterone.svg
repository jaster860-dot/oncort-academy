  <desc id="desc">Courbe de récupération pour « Récupération de la testostérone : expliquer l&apos;incertitude ». Le schéma relie Durée et agent ADT ; Terrain ; Testostérone + symptômes ; Réhabilitation et suivi PSA sans représenter de données patient ni remplacer le protocole source.</desc>
