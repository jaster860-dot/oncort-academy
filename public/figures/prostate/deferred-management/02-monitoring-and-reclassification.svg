<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
<title id="title">Surveillance active : le PSA alerte, l’histologie arbitre</title>
<desc id="desc">Calendrier multidimensionnel associant PSA, clinique, IRM et biopsies, puis gate de reclassification distinguant alerte biologique ou radiologique et confirmation histologique.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24313A"/></marker></defs>
<rect width="1376" height="768" fill="#FFF8E8"/>
<rect width="18" height="768" fill="#007C83"/>
<text x="58" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="1.8">ONCORT ACADEMY · PROSTATE</text>
<rect x="58" y="51" width="340" height="32" rx="16" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="76" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.7">CALENDRIER + GATE DE RECLASSIFICATION</text>
<text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">Surveillance active : le PSA alerte, l’histologie arbitre</text>
<rect x="58" y="152" width="1236" height="112" rx="17" fill="#DDF3F1" stroke="#007C83" stroke-width="3"/>
<text x="82" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#007C83" text-anchor="start" letter-spacing="0.7">PROGRAMME STRUCTURÉ</text>
<text x="82" y="224" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">PSA répété, habituellement ~6 mois</text>
<text x="432" y="224" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">Clinique</text>
<text x="628" y="224" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">IRM sériée</text>
<text x="850" y="224" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">Biopsies de contrôle</text>
<path d="M676 264 L676 306" stroke="#24313A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="58" y="306" width="380" height="238" rx="18" fill="#FFFFFF" stroke="#2563A6" stroke-width="3"/>
<text x="84" y="341" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#2563A6" text-anchor="start" letter-spacing="0">QUALITÉ INITIALE</text>
<text x="84" y="386" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="84" dy="0">IRM prébiopsique</tspan><tspan x="84" dy="31">Ciblées + systématiques</tspan><tspan x="84" dy="31">Concordance</tspan><tspan x="84" dy="31">→ confirmation précoce</tspan><tspan x="84" dy="31">parfois allégeable</tspan></text>
<rect x="478" y="306" width="380" height="238" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/>
<text x="504" y="341" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#D97706" text-anchor="start" letter-spacing="0">SIGNAL DE CHANGEMENT</text>
<text x="504" y="386" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="504" dy="0">PSA / PSADT</tspan><tspan x="504" dy="31">Progression IRM</tspan><tspan x="504" dy="31">Nouvelle anomalie clinique</tspan><tspan x="504" dy="31">= ALERTE</tspan><tspan x="504" dy="31">≠ traitement automatique</tspan></text>
<rect x="898" y="306" width="396" height="238" rx="18" fill="#FFFFFF" stroke="#C85C4A" stroke-width="3"/>
<text x="924" y="341" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#C85C4A" text-anchor="start" letter-spacing="0">ARBITRAGE</text>
<text x="924" y="386" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="924" dy="0">Biopsie en règle</tspan><tspan x="924" dy="31">ISUP 3 ou cribriforme/IDC</tspan><tspan x="924" dy="31">→ traitement différé</tspan><tspan x="924" dy="31">ISUP 2 : contextualiser</tspan><tspan x="924" dy="31">Comorbidité : parfois WW</tspan></text>
<path d="M438 425 L478 425" stroke="#24313A" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M858 425 L898 425" stroke="#24313A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="58" y="574" width="1236" height="102" rx="15" fill="#F8DDD7" stroke="#C85C4A" stroke-width="2"/>
<text x="82" y="606" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#24313A" text-anchor="start"><tspan x="82" dy="0">IRM stable ≠ suppression automatique de toute biopsie.</tspan><tspan x="82" dy="27">Allègement seulement si stabilité combinée IRM + densité PSA + histologie antérieure + protocole.</tspan></text>
<rect x="58" y="700" width="1260" height="42" rx="12" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="78" y="727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCES · CCAFU 2024–2026 · EAU 2026</text>
<text x="1298" y="727" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BBD8D2" text-anchor="end" letter-spacing="0">SYNTHÈSE ÉDUCATIVE · DONNÉES AGRÉGÉES</text>
</svg>
