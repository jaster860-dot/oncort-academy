<text x="340" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0">BÉNÉFICE / DÉLAI</text>
<text x="640" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0">TOXICITÉS / CHARGE</text>
<text x="1010" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SUITE POSSIBLE</text>
<rect x="59" y="208" width="1234" height="82" fill="#DDF3F1" opacity="0.75"/>
<text x="80" y="257" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Surveillance active</text>
<text x="340" y="257" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Curatif conservé</text>
<text x="640" y="257" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">IRM / biopsies / incertitude</text>
<text x="1010" y="257" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Traitement différé si reclassement</text>
<rect x="59" y="290" width="1234" height="82" fill="#FCE8C8" opacity="0.75"/>
<text x="80" y="339" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Abstention-surveillance</text>
<text x="340" y="339" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Pas de bénéfice curatif utile</text>
<text x="640" y="339" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Suivi clinique allégé</text>
<text x="1010" y="339" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Palliatif si symptômes / menace</text>
<rect x="59" y="372" width="1234" height="82" fill="#E5EEF8" opacity="0.75"/>
<text x="80" y="421" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#24313A" text-anchor="start" letter-spacing="0">Traitement radical</text>
<text x="340" y="421" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Contrôle local attendu</text>
<text x="640" y="421" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Urinaire / sexuel / digestif</text>
