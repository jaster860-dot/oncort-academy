<rect x="692" y="490" width="602" height="186" rx="17" fill="#FCE8C8" stroke="#D97706" stroke-width="2"/>
<text x="716" y="524" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#D97706" text-anchor="start" letter-spacing="0">RÉVISER</text>
<text x="716" y="558" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="716" dy="0">Calendrier</tspan><tspan x="716" dy="29">Seuils de réévaluation</tspan><tspan x="716" dy="29">Évolution de santé / préférences</tspan><tspan x="716" dy="29">Changer de trajectoire ≠ erreur initiale</tspan></text>
