<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
<title id="title">Décision partagée : comparer des trajectoires complètes et révisables</title>
<desc id="desc">Matrice de décision partagée comparant bénéfice, délai, toxicité, charge de suivi et rattrapage, puis documentant préférences et plan de réévaluation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24313A"/></marker></defs>
