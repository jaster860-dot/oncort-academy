<text x="82" y="637" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#FFFFFF" text-anchor="start"><tspan x="82" dy="0">Comparer surveillance active, traitement focal expérimental et standards avec le même niveau de détail.</tspan><tspan x="82" dy="24">Le choix du patient n’annule pas l’obligation de nommer l’incertitude oncologique à long terme.</tspan></text>
