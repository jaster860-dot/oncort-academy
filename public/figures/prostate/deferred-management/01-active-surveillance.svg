<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
<title id="title">Surveillance active : sélectionner, surveiller, reclasser</title>
<desc id="desc">Matrice d’éligibilité à la surveillance active distinguant standard faible risque, sélection intermédiaire favorable, facteurs patient et signaux histologiques d’exclusion.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24313A"/></marker></defs>
<rect width="1376" height="768" fill="#FFF8E8"/>
<rect width="18" height="768" fill="#007C83"/>
<text x="58" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="1.8">ONCORT ACADEMY · PROSTATE</text>
<rect x="58" y="51" width="340" height="32" rx="16" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="76" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.7">ÉLIGIBILITÉ + EXCLUSIONS</text>
<text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">Surveillance active : sélectionner, surveiller, reclasser</text>
<rect x="58" y="152" width="602" height="314" rx="18" fill="#FFFFFF" stroke="#007C83" stroke-width="3"/>
<text x="84" y="187" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#007C83" text-anchor="start" letter-spacing="0">ÉLIGIBILITÉ ONCOLOGIQUE</text>
<rect x="84" y="218" width="550" height="66" rx="13" fill="#DDF3F1" stroke="#007C83" stroke-width="2"/>
<text x="359" y="258" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="850" fill="#007C83" text-anchor="middle" letter-spacing="0">FAIBLE RISQUE · STANDARD</text>
<rect x="84" y="304" width="550" height="120" rx="13" fill="#E5EEF8" stroke="#2563A6" stroke-width="2"/>
<text x="106" y="336" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#24313A" text-anchor="start"><tspan x="106" dy="0">INTERMÉDIAIRE FAVORABLE · SÉLECTION</tspan><tspan x="106" dy="27">ISUP · PSA / densité · cT · IRM</tspan><tspan x="106" dy="27">biopsies ciblées + systématiques · charge tumorale</tspan></text>
<rect x="692" y="152" width="602" height="314" rx="18" fill="#FFFFFF" stroke="#2563A6" stroke-width="3"/>
<text x="718" y="187" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#2563A6" text-anchor="start" letter-spacing="0">ÉLIGIBILITÉ DU PATIENT</text>
<text x="718" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="718" dy="0">Espérance de vie compatible avec bénéfice curatif</tspan><tspan x="718" dy="45">souvent &gt; 10 ans selon les référentiels</tspan><tspan x="718" dy="45">Préférences et tolérance à l’incertitude</tspan><tspan x="718" dy="45">Capacité à suivre IRM / biopsies / PSA</tspan></text>
<rect x="58" y="494" width="1236" height="124" rx="17" fill="#F8DDD7" stroke="#C85C4A" stroke-width="2"/>
<text x="82" y="528" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#C85C4A" text-anchor="start" letter-spacing="0">SIGNAL D’EXCLUSION FORT</text>
<text x="82" y="561" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#24313A" text-anchor="start"><tspan x="82" dy="0">Architecture cribriforme ou intracanalaire : exclusion selon consensus CCAFU–EAU.</tspan><tspan x="82" dy="25">IRM visible, histoire familiale ou mutation modifient l’incertitude mais ne produisent pas à elles seules une règle identique.</tspan></text>
<rect x="58" y="642" width="1236" height="34" rx="10" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="676" y="665" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Intention curative conservée · traitement différé si reclassification documentée</text>
<rect x="58" y="700" width="1260" height="42" rx="12" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="78" y="727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCES · CCAFU 2024–2026 · EAU 2026 · RecoRad 2025</text>
<text x="1298" y="727" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BBD8D2" text-anchor="end" letter-spacing="0">SYNTHÈSE ÉDUCATIVE · DONNÉES AGRÉGÉES</text>
