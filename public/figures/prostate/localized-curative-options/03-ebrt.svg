    <text x="688" y="270" font-family="Arial" font-size="20" font-weight="850" fill="#D97706" text-anchor="middle">INTERMÉDIAIRE</text><g><ellipse cx="646" cy="344" rx="31" ry="18" fill="#FCE8C8" stroke="#D97706" stroke-width="4"/><ellipse cx="730" cy="344" rx="31" ry="18" fill="#FCE8C8" stroke="#D97706" stroke-width="4"/><path d="M 610 380 Q 688 328 766 380 L 753 472 Q 688 508 623 472 Z" fill="#DDF3F1" stroke="#007C83" stroke-width="5"/></g><text x="524" y="530" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="650" fill="#24313A" text-anchor="start"><tspan x="524" dy="0">Volumes et éventuelle ADT</tspan><tspan x="524" dy="21">dépendent du profil</tspan><tspan x="524" dy="21">favorable/défavorable ; ne pas</tspan><tspan x="524" dy="21">uniformiser.</tspan></text>
