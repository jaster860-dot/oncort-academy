  <title id="title">Radiothérapie externe : un traitement curatif construit par risque</title>
  <desc id="desc">Construction du traitement par risque pour « Radiothérapie externe : un traitement curatif construit par risque ». Le schéma relie Groupe de risque ; Volumes et fractionnement ; Éventuelle hormonothérapie ; Contrôle et toxicités tardives sans représenter de données patient ni remplacer le protocole source.</desc>
