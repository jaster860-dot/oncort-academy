  <g><rect x="70" y="230" width="1236" height="392" rx="24" fill="#FFFCF4" stroke="#24313A" stroke-width="3"/><line x1="482" y1="230" x2="482" y2="622" stroke="#D8D5C9" stroke-width="3"/><line x1="894" y1="230" x2="894" y2="622" stroke="#D8D5C9" stroke-width="3"/>
