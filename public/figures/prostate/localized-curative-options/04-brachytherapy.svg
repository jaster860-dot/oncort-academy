<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
<title id="title">Curiethérapie : technique, fonction urinaire et objectif ne se confondent pas</title>
<desc id="desc">Comparaison des usages LDR et HDR, puis filtre urinaire avant curiethérapie et balance bénéfice-toxicity du boost.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24313A"/></marker></defs>
<rect width="1376" height="768" fill="#FFF8E8"/>
<rect width="18" height="768" fill="#007C83"/>
<text x="58" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="1.8">ONCORT ACADEMY · PROSTATE</text>
<rect x="58" y="51" width="340" height="32" rx="16" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="76" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.7">COMPARAISON LDR / HDR + SÉLECTION</text>
<text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">Curiethérapie : technique, fonction urinaire et objectif ne se confondent pas</text>
<rect x="58" y="152" width="602" height="196" rx="18" fill="#FFFFFF" stroke="#2563A6" stroke-width="3"/>
<text x="84" y="188" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#2563A6" text-anchor="start" letter-spacing="0">LDR · IMPLANTS PERMANENTS</text>
<text x="84" y="230" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="84" dy="0">Monothérapie possible</tspan><tspan x="84" dy="30">chez certains faibles risques</tspan><tspan x="84" dy="30">ou intermédiaires favorables</tspan></text>
<rect x="692" y="152" width="602" height="196" rx="18" fill="#FFFFFF" stroke="#007C83" stroke-width="3"/>
<text x="718" y="188" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#007C83" text-anchor="start" letter-spacing="0">HDR · CATHÉTERS TEMPORAIRES</text>
<text x="718" y="230" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="718" dy="0">Monothérapie dans indications sélectionnées</tspan><tspan x="718" dy="30">ou boost avec RT externe</tspan><tspan x="718" dy="30">selon risque et expertise</tspan></text>
<rect x="58" y="378" width="786" height="208" rx="18" fill="#FCE8C8" stroke="#D97706" stroke-width="2"/>
<text x="84" y="412" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#D97706" text-anchor="start" letter-spacing="0">FILTRE URINAIRE ET TECHNIQUE</text>
<text x="84" y="454" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="84" dy="0">Symptômes / débit · volume prostatique · lobe médian</tspan><tspan x="84" dy="32">TURP antérieure · anatomie pubienne · faisabilité de l’implant</tspan><tspan x="84" dy="32">Facteurs souvent relatifs : dépendance à la technique et au centre</tspan></text>
<rect x="874" y="378" width="420" height="208" rx="18" fill="#F8DDD7" stroke="#C85C4A" stroke-width="2"/>
<text x="900" y="412" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#C85C4A" text-anchor="start" letter-spacing="0">BOOST : COMPROMIS</text>
<text x="900" y="454" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#24313A" text-anchor="start"><tspan x="900" dy="0">↑ contrôle biochimique</tspan><tspan x="900" dy="30">↑ toxicité urinaire</tspan><tspan x="900" dy="30">OS non démontrée</tspan><tspan x="900" dy="30">dans essais de référence</tspan></text>
<rect x="58" y="616" width="1236" height="60" rx="14" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="676" y="653" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Plus de dose n’est pas gratuitement meilleur : sélectionner indication, fonction et expertise.</text>
<rect x="58" y="700" width="1260" height="42" rx="12" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="78" y="727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCES · CCAFU 2024–2026 · EAU 2026 · RecoRad 2025</text>
<text x="1298" y="727" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BBD8D2" text-anchor="end" letter-spacing="0">SYNTHÈSE ÉDUCATIVE · DONNÉES AGRÉGÉES</text>
</svg>
