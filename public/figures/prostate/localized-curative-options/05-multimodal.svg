<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
<title id="title">Comparer les trajectoires complètes, pas seulement le premier traitement</title>
<desc id="desc">Deux trajectoires montrent les traitements associés possibles après chirurgie ou radiothérapie définitive et l’asymétrie des options de rattrapage.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24313A"/></marker></defs>
<rect width="1376" height="768" fill="#FFF8E8"/>
<rect width="18" height="768" fill="#007C83"/>
<text x="58" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="1.8">ONCORT ACADEMY · PROSTATE</text>
<rect x="58" y="51" width="340" height="32" rx="16" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="76" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.7">PARCOURS MULTIMODAUX ASYMÉTRIQUES</text>
<text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">Comparer les trajectoires complètes, pas seulement le premier traitement</text>
<rect x="58" y="152" width="602" height="400" rx="18" fill="#FFFFFF" stroke="#2563A6" stroke-width="3"/>
<text x="84" y="188" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#2563A6" text-anchor="start" letter-spacing="0">TRAJECTOIRE CHIRURGICALE</text>
<rect x="84" y="220" width="550" height="64" rx="13" fill="#E5EEF8" stroke="#2563A6" stroke-width="2"/>
<text x="359" y="259" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="850" fill="#2563A6" text-anchor="middle" letter-spacing="0">PROSTATECTOMIE</text>
<path d="M359 284 L359 322" stroke="#24313A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="84" y="322" width="550" height="82" rx="13" fill="#FFFFFF" stroke="#D8D5C9" stroke-width="2"/>
<text x="106" y="352" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="106" dy="0">Pathologie + PSA</tspan><tspan x="106" dy="26">→ surveillance ou RT de rattrapage ± ADT</tspan></text>
<rect x="84" y="432" width="550" height="92" rx="13" fill="#DDF3F1" stroke="#007C83" stroke-width="2"/>
<text x="106" y="463" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#007C83" text-anchor="start"><tspan x="106" dy="0">Salvage du lit = stratégie établie</tspan><tspan x="106" dy="25">si indication et timing appropriés</tspan></text>
<rect x="692" y="152" width="602" height="400" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/>
<text x="718" y="188" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" fill="#D97706" text-anchor="start" letter-spacing="0">TRAJECTOIRE RADIOTHÉRAPIE</text>
<rect x="718" y="220" width="550" height="64" rx="13" fill="#FCE8C8" stroke="#D97706" stroke-width="2"/>
<text x="993" y="259" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="850" fill="#D97706" text-anchor="middle" letter-spacing="0">RT DÉFINITIVE ± ADT / BOOST</text>
<path d="M993 284 L993 322" stroke="#24313A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="718" y="322" width="550" height="82" rx="13" fill="#FFFFFF" stroke="#D8D5C9" stroke-width="2"/>
<text x="740" y="352" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="740" dy="0">PSA + imagerie + preuve locale</tspan><tspan x="740" dy="26">→ sélection experte du rattrapage</tspan></text>
<rect x="718" y="432" width="550" height="92" rx="13" fill="#F8DDD7" stroke="#C85C4A" stroke-width="2"/>
<text x="740" y="463" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" fill="#C85C4A" text-anchor="start"><tspan x="740" dy="0">Chirurgie / curie / SBRT / ablation</tspan><tspan x="740" dy="25">possibles chez sélection stricte, morbidité accrue</tspan></text>
<rect x="58" y="580" width="1236" height="96" rx="15" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="82" y="612" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#BBD8D2" text-anchor="start" letter-spacing="0">ASYMÉTRIE À EXPLIQUER</text>
<text x="82" y="641" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="750" fill="#FFFFFF" text-anchor="start"><tspan x="82" dy="0">« Chaque option peut toujours rattraper l’autre » est faux.</tspan><tspan x="82" dy="24">Comparer traitements associés probables, séquelles dominantes et options réalistes de rattrapage.</tspan></text>
<rect x="58" y="700" width="1260" height="42" rx="12" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="78" y="727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCES · CCAFU 2024–2026 · EAU 2026 · RecoRad 2025</text>
<text x="1298" y="727" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BBD8D2" text-anchor="end" letter-spacing="0">SYNTHÈSE ÉDUCATIVE · DONNÉES AGRÉGÉES</text>
</svg>
