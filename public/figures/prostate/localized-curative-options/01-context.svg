<text x="714" y="604" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="714" dy="0">Ne pas présenter au même niveau</tspan><tspan x="714" dy="25">qu’une option standard établie</tspan></text>
