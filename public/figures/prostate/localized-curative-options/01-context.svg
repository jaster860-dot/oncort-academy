<text x="82" y="604" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="82" dy="0">Soutenue par recommandations</tspan><tspan x="82" dy="25">mais parfois techniquement défavorable</tspan></text>
