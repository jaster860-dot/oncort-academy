<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
<title id="title">Prostatectomie : traitement local, information pathologique, parcours possible</title>
<desc id="desc">Parcours depuis la sélection avant prostatectomie jusqu’à la pathologie et au PSA postopératoires, avec branches de surveillance ou de rattrapage et encadré fonctionnel.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24313A"/></marker></defs>
<rect width="1376" height="768" fill="#FFF8E8"/>
<rect width="18" height="768" fill="#007C83"/>
<text x="58" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="1.8">ONCORT ACADEMY · PROSTATE</text>
<rect x="58" y="51" width="340" height="32" rx="16" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="0"/>
<text x="76" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#007C83" text-anchor="start" letter-spacing="0.7">TRAJECTOIRE POSTOPÉRATOIRE</text>
<text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#24313A" text-anchor="start" letter-spacing="0">Prostatectomie : traitement local, information pathologique, parcours possible</text>
<rect x="58" y="154" width="296" height="430" rx="18" fill="#FFFFFF" stroke="#007C83" stroke-width="3"/>
<text x="84" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#007C83" text-anchor="start" letter-spacing="0">AVANT L’OPÉRATION</text>
<text x="84" y="232" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="84" dy="0">Risque tumoral</tspan><tspan x="84" dy="47">État de santé</tspan><tspan x="84" dy="47">Résécabilité</tspan><tspan x="84" dy="47">Espérance de vie</tspan><tspan x="84" dy="47">Fonctions initiales</tspan><tspan x="84" dy="47">Conséquences acceptées</tspan></text>
<rect x="382" y="154" width="356" height="430" rx="18" fill="#FFFFFF" stroke="#2563A6" stroke-width="3"/>
<text x="408" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#2563A6" text-anchor="start" letter-spacing="0">PIÈCE + PSA</text>
<rect x="408" y="222" width="304" height="120" rx="15" fill="#E5EEF8" stroke="#2563A6" stroke-width="2"/>
<text x="430" y="255" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="850" fill="#24313A" text-anchor="start"><tspan x="430" dy="0">pT · marges · grade</tspan><tspan x="430" dy="28">pN si curage indiqué</tspan><tspan x="430" dy="28">PSA postopératoire</tspan></text>
<text x="408" y="392" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="408" dy="0">La pathologie affine</tspan><tspan x="408" dy="28">le risque ; elle ne garantit</tspan><tspan x="408" dy="28">pas la fin du traitement.</tspan></text>
<rect x="766" y="154" width="528" height="196" rx="18" fill="#FFFFFF" stroke="#007C83" stroke-width="3"/>
<text x="792" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#007C83" text-anchor="start" letter-spacing="0">SI PSA INDÉTECTABLE</text>
<text x="792" y="231" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="792" dy="0">Surveillance structurée</tspan><tspan x="792" dy="30">Rattrapage précoce si remontée confirmée</tspan></text>
<rect x="766" y="374" width="528" height="210" rx="18" fill="#FFFFFF" stroke="#C85C4A" stroke-width="3"/>
<text x="792" y="408" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="850" fill="#C85C4A" text-anchor="start" letter-spacing="0">SI PSA PERSISTANT / ASCENDANT</text>
<text x="792" y="452" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" fill="#24313A" text-anchor="start"><tspan x="792" dy="0">Réévaluer stade et facteurs</tspan><tspan x="792" dy="31">RT de rattrapage ± ADT</tspan><tspan x="792" dy="31">selon niveau de risque</tspan></text>
<path d="M354 365 L382 365" stroke="#24313A" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M738 365 L766 260" stroke="#24313A" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M738 365 L766 478" stroke="#24313A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="58" y="612" width="1236" height="64" rx="14" fill="#FCE8C8" stroke="#D97706" stroke-width="2"/>
<text x="82" y="649" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" fill="#D97706" text-anchor="start" letter-spacing="0">FONCTIONS</text>
<text x="186" y="649" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="750" fill="#24313A" text-anchor="start" letter-spacing="0">Incontinence et fonction érectile discutées avant geste ; robot et préservation nerveuse n’annulent pas le compromis oncologique.</text>
<rect x="58" y="700" width="1260" height="42" rx="12" fill="#24313A" stroke="#24313A" stroke-width="0"/>
<text x="78" y="727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCES · CCAFU 2024–2026 · EAU 2026</text>
<text x="1298" y="727" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BBD8D2" text-anchor="end" letter-spacing="0">SYNTHÈSE ÉDUCATIVE · DONNÉES AGRÉGÉES</text>
</svg>
